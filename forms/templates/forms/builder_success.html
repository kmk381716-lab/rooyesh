{% extends "base.html" %}

{% block content %}


<style>

    /* =========================================================
       SUCCESS PAGE — با تم یکسان
    ========================================================= */

    .success-page,
    .success-page * {
        box-sizing: border-box;
    }


    .success-page {

        /* دارک (پیش‌فرض) */

        --sp-card-1: #1a3055;
        --sp-card-2: #102040;
        --sp-border: rgba(109, 164, 255, 0.28);
        --sp-border-hover: rgba(109, 164, 255, 0.55);

        --sp-text: #e0eaff;
        --sp-text-soft: #c8d8f5;
        --sp-muted: #7a8fb5;
        --sp-dim: #5a6d8e;

        --sp-input: #050b18;
        --sp-input-hover: #08111f;
        --sp-input-focus: #020610;
        --sp-input-border: rgba(109, 164, 255, 0.42);

        --sp-green: #2dc98f;
        --sp-green-light: #4ade80;
        --sp-blue: #4a7de8;
        --sp-blue-light: #6da4ff;
        --sp-cyan: #4cc9e8;

        --sp-shadow:
            0 30px 80px rgba(0, 0, 0, 0.55),
            0 0 60px rgba(74, 125, 232, 0.14),
            inset 0 1px 0 rgba(180, 220, 255, 0.16);


        position: relative;

        width: 100%;

        min-height: calc(100vh - 200px);

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 30px 20px 50px;

        color: var(--sp-text);

        transition: color 0.4s ease;
    }


    /* تم روشن */

    body.light .success-page {

        --sp-card-1: #c8d8f2;
        --sp-card-2: #b0c4e8;
        --sp-border: rgba(58, 109, 224, 0.35);
        --sp-border-hover: rgba(58, 109, 224, 0.6);

        --sp-text: #0a1630;
        --sp-text-soft: #1a2b52;
        --sp-muted: #4a5c80;
        --sp-dim: #6a7ba0;

        --sp-input: #f5f8ff;
        --sp-input-hover: #ffffff;
        --sp-input-focus: #ffffff;
        --sp-input-border: rgba(58, 109, 224, 0.35);

        --sp-green: #167a52;
        --sp-green-light: #1e9668;
        --sp-blue: #2a6bff;
        --sp-blue-light: #2a6bff;
        --sp-cyan: #2e7bc4;

        --sp-shadow:
            0 30px 80px rgba(58, 109, 224, 0.22),
            0 0 60px rgba(58, 109, 224, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }


    /* =========================================================
       CARD
    ========================================================= */

    .success-card {

        position: relative;

        z-index: 2;

        width: 100%;

        max-width: 620px;

        padding: 40px 34px 32px;

        text-align: center;

        border: 1.5px solid var(--sp-border);

        border-radius: 24px;

        background:
            linear-gradient(
                155deg,
                var(--sp-card-1) 0%,
                var(--sp-card-2) 100%
            );

        box-shadow: var(--sp-shadow);

        overflow: hidden;

        animation:
            successCardShow 0.75s
            cubic-bezier(.22, 1, .36, 1);

        transition:
            background 0.4s ease,
            border-color 0.4s ease,
            box-shadow 0.4s ease;
    }


    .success-card::after {

        content: "";

        position: absolute;

        top: 0;
        right: 0;
        left: 0;

        height: 3px;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--sp-green-light),
                var(--sp-cyan),
                var(--sp-blue-light),
                transparent
            );

        background-size: 200% 100%;

        animation: successBorderShine 4s linear infinite;

        opacity: 0.9;
    }


    @keyframes successBorderShine {

        to { background-position: 200% 0; }
    }


    /* =========================================================
       ICON
    ========================================================= */

    .success-icon-wrap {

        position: relative;

        width: 90px;
        height: 90px;

        margin: 0 auto 22px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 26px;

        background:
            linear-gradient(
                145deg,
                rgba(74, 222, 128, 0.18),
                rgba(76, 201, 232, 0.14)
            );

        border: 1.5px solid rgba(74, 222, 128, 0.4);

        box-shadow:
            inset 0 1px 0 rgba(180, 255, 220, 0.18),
            0 14px 35px rgba(74, 222, 128, 0.2);

        animation:
            iconShow 0.65s 0.10s both
            cubic-bezier(.22, 1, .36, 1);
    }


    .success-icon-wrap::before {

        content: "";

        position: absolute;

        inset: -12px;

        border-radius: 34px;

        border: 1.5px solid rgba(74, 222, 128, 0.25);

        animation:
            iconRing 2.7s ease-out infinite;

        pointer-events: none;
    }


    @keyframes iconRing {

        0% {
            opacity: 0.6;
            transform: scale(0.92);
        }

        70% {
            opacity: 0;
            transform: scale(1.18);
        }

        100% {
            opacity: 0;
            transform: scale(1.18);
        }
    }


    .success-icon {

        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: center;

        width: 58px;
        height: 58px;

        border-radius: 18px;

        background:
            linear-gradient(
                135deg,
                rgba(74, 222, 128, 0.3),
                rgba(76, 201, 232, 0.22)
            );

        color: #6ee7b7;

        font-size: 30px;

        font-weight: 900;

        box-shadow:
            0 0 30px rgba(74, 222, 128, 0.35),
            inset 0 1px 0 rgba(180, 255, 220, 0.25);
    }


    body.light .success-icon {
        color: #167a52;
    }


    /* =========================================================
       TITLE
    ========================================================= */

    .success-title {

        position: relative;

        z-index: 2;

        margin: 0 0 12px;

        color: var(--sp-text);

        font-size: 28px;

        line-height: 1.5;

        font-weight: 800;

        letter-spacing: -0.6px;

        animation:
            successTextShow 0.6s 0.18s both
            cubic-bezier(.22, 1, .36, 1);
    }


    .success-text {

        position: relative;

        z-index: 2;

        margin: 0 auto;

        max-width: 500px;

        color: var(--sp-muted);

        font-size: 13px;

        font-weight: 500;

        line-height: 2;

        overflow-wrap: anywhere;

        animation:
            successTextShow 0.6s 0.24s both
            cubic-bezier(.22, 1, .36, 1);
    }


    .success-text strong {

        color: var(--sp-text-soft);

        font-weight: 800;
    }


    /* =========================================================
       LINK SECTION
    ========================================================= */

    .link-section {

        position: relative;

        z-index: 2;

        margin-top: 28px;

        animation:
            linkShow 0.6s 0.30s both
            cubic-bezier(.22, 1, .36, 1);
    }


    .link-label {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 10px;

        margin-bottom: 10px;

        color: var(--sp-text-soft);

        font-size: 12.5px;

        font-weight: 700;

        text-align: right;
    }


    .link-status {

        display: inline-flex;

        align-items: center;

        gap: 7px;

        color: var(--sp-green-light);

        font-size: 11px;

        font-weight: 700;
    }


    body.light .link-status {
        color: #167a52;
    }


    .link-status span {

        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: var(--sp-green-light);

        box-shadow: 0 0 10px rgba(74, 222, 128, 0.8);

        animation: dotPulse 2s ease-in-out infinite;
    }


    @keyframes dotPulse {

        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
    }


    /* =========================================================
       LINK INPUT
    ========================================================= */

    .form-link {

        display: block !important;

        width: 100% !important;

        min-height: 52px !important;

        padding: 14px 16px !important;

        border-radius: 12px !important;

        border: 1.5px solid var(--sp-input-border) !important;

        background: var(--sp-input) !important;

        background-color: var(--sp-input) !important;

        color: var(--sp-text) !important;

        direction: ltr !important;

        text-align: left !important;

        font-family: 'Vazirmatn', Tahoma, sans-serif !important;

        font-size: 12.5px !important;

        font-weight: 600 !important;

        line-height: 1.7 !important;

        outline: none !important;

        overflow: hidden !important;

        text-overflow: ellipsis !important;

        white-space: nowrap !important;

        box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.3) inset,
            0 2px 6px rgba(0, 0, 0, 0.4) inset !important;

        transition:
            border-color 0.25s ease,
            box-shadow 0.25s ease,
            background 0.25s ease !important;
    }


    body.light .form-link {

        box-shadow:
            0 0 0 1px rgba(0, 0, 0, 0.03) inset,
            0 2px 6px rgba(58, 109, 224, 0.08) inset !important;
    }


    .form-link:hover {

        background: var(--sp-input-hover) !important;

        background-color: var(--sp-input-hover) !important;

        border-color: rgba(109, 164, 255, 0.7) !important;
    }


    .form-link:focus {

        border-color: var(--sp-blue-light) !important;

        background: var(--sp-input-focus) !important;

        background-color: var(--sp-input-focus) !important;

        box-shadow:
            0 0 0 4px rgba(74, 125, 232, 0.25) !important,
            0 10px 25px rgba(0, 0, 0, 0.3) !important;
    }


    /* =========================================================
       ACTIONS
    ========================================================= */

    .actions {

        display: flex;

        justify-content: center;

        gap: 12px;

        margin-top: 14px;

        flex-wrap: wrap;
    }


    .copy-btn,
    .new-form-btn {

        position: relative;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        min-height: 50px;

        padding: 13px 22px;

        border-radius: 12px;

        font-family: 'Vazirmatn', Tahoma, sans-serif;

        font-size: 13px;

        font-weight: 800;

        cursor: pointer;

        overflow: hidden;

        text-decoration: none;

        transition:
            transform 0.25s ease,
            background 0.25s ease,
            border-color 0.25s ease,
            box-shadow 0.25s ease,
            color 0.25s ease;
    }


    /* COPY BUTTON */

    .copy-btn {

        flex: 1 1 200px;

        border: none;

        background:
            linear-gradient(
                135deg,
                #3a6bc4,
                #2e7fc4 58%,
                #2a9ac4
            );

        color: #dbe6ff;

        box-shadow:
            0 12px 30px rgba(74, 125, 232, 0.45),
            inset 0 1px 0 rgba(180, 220, 255, 0.2);
    }


    .copy-btn::before {

        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                110deg,
                transparent 20%,
                rgba(180, 220, 255, 0.3) 50%,
                transparent 80%
            );

        transform: translateX(120%);

        transition: transform 0.65s ease;
    }


    .copy-btn span {
        position: relative;
        z-index: 2;
    }


    .copy-btn:hover {

        transform: translateY(-3px);

        color: #b8d0ff;

        box-shadow:
            0 20px 45px rgba(58, 107, 196, 0.55),
            0 0 45px rgba(76, 201, 232, 0.35);

        filter: brightness(1.08);
    }


    .copy-btn:hover::before {
        transform: translateX(-120%);
    }


    .copy-btn:active {
        transform: translateY(0) scale(0.985);
    }


    .copy-btn.copied {

        background:
            linear-gradient(
                135deg,
                #1e9668,
                #239d75
            );

        color: #d8f4ea;

        box-shadow:
            0 12px 30px rgba(45, 201, 143, 0.5),
            0 0 40px rgba(74, 222, 128, 0.3);
    }


    /* NEW FORM BUTTON */

    .new-form-btn {

        flex: 0 0 auto;

        border: 1.5px solid rgba(109, 164, 255, 0.3);

        background: rgba(109, 164, 255, 0.1);

        color: var(--sp-text-soft);
    }


    body.light .new-form-btn {

        background: rgba(58, 109, 224, 0.08);

        border-color: rgba(58, 109, 224, 0.3);
    }


    .new-form-btn:hover {

        transform: translateY(-3px);

        background: rgba(109, 164, 255, 0.2);

        border-color: rgba(109, 164, 255, 0.6);

        color: var(--sp-text);

        box-shadow: 0 12px 28px rgba(74, 125, 232, 0.28);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .success-footer {

        position: relative;

        z-index: 2;

        margin-top: 26px;

        padding-top: 18px;

        border-top: 1.5px solid var(--sp-border);

        color: var(--sp-dim);

        font-size: 10.5px;

        font-weight: 500;

        line-height: 1.9;

        animation:
            successTextShow 0.6s 0.38s both;
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes successCardShow {

        from {
            opacity: 0;
            transform: translateY(28px) scale(0.975);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }


    @keyframes iconShow {

        from {
            opacity: 0;
            transform: scale(0.75) rotate(-7deg);
        }

        to {
            opacity: 1;
            transform: scale(1) rotate(0);
        }
    }


    @keyframes successTextShow {

        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    @keyframes linkShow {

        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 800px) {

        .success-page {
            padding: 24px 14px 40px;
        }


        .success-card {
            padding: 32px 24px 26px;
            border-radius: 20px;
        }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

        .success-page {
            padding: 20px 12px 35px;
            min-height: auto;
        }


        .success-card {
            max-width: 100%;
            padding: 28px 18px 24px;
            border-radius: 18px;
        }


        .success-icon-wrap {

            width: 74px;
            height: 74px;
            margin-bottom: 18px;
            border-radius: 22px;
        }


        .success-icon {

            width: 48px;
            height: 48px;
            border-radius: 15px;
            font-size: 24px;
        }


        .success-title {

            font-size: 22px;
            margin-bottom: 10px;
        }


        .success-text {
            font-size: 12px;
            line-height: 1.95;
        }


        .link-section {
            margin-top: 22px;
        }


        .link-label {
            font-size: 12px;
        }


        .link-status {
            font-size: 10.5px;
        }


        .form-link {

            min-height: 50px !important;
            padding: 13px 14px !important;
            font-size: 11.5px !important;
        }


        .actions {

            flex-direction: column;
            gap: 10px;
        }


        .copy-btn,
        .new-form-btn {

            width: 100%;
            flex: 1 1 auto;
            min-height: 52px;
            font-size: 13px;
        }


        .success-footer {

            margin-top: 22px;
            padding-top: 16px;
            font-size: 10px;
        }
    }


    /* =========================================================
       TINY PHONES
    ========================================================= */

    @media (max-width: 380px) {

        .success-page {
            padding: 14px 8px 28px;
        }


        .success-card {
            padding: 22px 14px 20px;
            border-radius: 16px;
        }


        .success-icon-wrap {

            width: 64px;
            height: 64px;
            border-radius: 18px;
        }


        .success-icon {

            width: 42px;
            height: 42px;
            border-radius: 13px;
            font-size: 21px;
        }


        .success-title {
            font-size: 19px;
        }


        .success-text {
            font-size: 11.5px;
        }


        .form-link {

            font-size: 10.5px !important;
            min-height: 48px !important;
        }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        .success-page *,
        .success-page *::before,
        .success-page *::after {

            animation-duration: 0.01ms !important;

            animation-iteration-count: 1 !important;

            transition-duration: 0.01ms !important;
        }
    }

</style>



<div class="success-page">


    <div class="success-card">


        <!-- ICON -->

        <div class="success-icon-wrap">

            <div class="success-icon">
                ✓
            </div>

        </div>



        <!-- TITLE -->

        <h1 class="success-title">
            فرم با موفقیت ساخته شد
        </h1>


        <p class="success-text">

            فرم
            <strong>
                «{{ form.title }}»
            </strong>
            با موفقیت ایجاد شد و لینک آن آماده استفاده است.

        </p>



        <!-- LINK -->

        <div class="link-section">


            <div class="link-label">

                <span>
                    لینک فرم
                </span>


                <span class="link-status">

                    <span></span>

                    آماده انتشار

                </span>

            </div>


            <input
                id="formLink"
                class="form-link"
                type="text"
                readonly
                value="{{ request.scheme }}://{{ request.get_host }}{% url 'forms:fill_form' form.id %}"
            >


            <div class="actions">


                <button
                    type="button"
                    class="copy-btn"
                    id="copyButton"
                    onclick="copyLink()"
                >

                    <span id="copyText">
                        📋 کپی لینک
                    </span>

                </button>


                <a
                    href="{% url 'forms:fill_form' form.id %}"
                    class="new-form-btn"
                    target="_blank"
                    rel="noopener"
                >
                    👁 مشاهده فرم
                </a>


            </div>


        </div>



        <!-- FOOTER -->

        <div class="success-footer">

            کانون فرهنگی تربیتی رویش
            <br>
            فرم‌ساز کانون

        </div>


    </div>


</div>



<script>

function copyLink() {

    const input =
        document.getElementById("formLink");

    const button =
        document.getElementById("copyButton");

    const text =
        document.getElementById("copyText");


    navigator.clipboard
        .writeText(input.value)

        .then(() => {

            showCopiedState();

        })

        .catch(() => {

            fallbackCopy(input);

        });

}


function fallbackCopy(input) {

    input.focus();
    input.select();
    input.setSelectionRange(0, 99999);


    try {

        document.execCommand("copy");

        showCopiedState();

    } catch (error) {

        const button =
            document.getElementById("copyButton");

        const text =
            document.getElementById("copyText");


        text.textContent =
            "لینک را دستی کپی کنید";

        button.classList.remove("copied");

    }

}


function showCopiedState() {

    const button =
        document.getElementById("copyButton");

    const text =
        document.getElementById("copyText");


    button.classList.add("copied");


    text.textContent =
        "✓ لینک کپی شد";


    setTimeout(() => {

        button.classList.remove("copied");

        text.textContent =
            "📋 کپی لینک";

    }, 2000);

}

</script>


{% endblock %}
