
{% extends "base.html" %}

{% block content %}

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
    }

    .success-page {
        width: 100%;
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: #0d0f14;
    }

    .success-card {
        width: 100%;
        max-width: 600px;
        background: #171a21;
        border: 1px solid #282d36;
        border-radius: 20px;
        padding: 35px;
        text-align: center;
        color: #ffffff;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .success-icon {
        font-size: 50px;
        line-height: 1;
        margin-bottom: 15px;
    }

    .success-title {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.5;
    }

    .success-text {
        margin: 0;
        color: #8d96a5;
        font-size: 15px;
        line-height: 1.8;
        overflow-wrap: anywhere;
    }

    .form-link {
        display: block;
        width: 100%;
        max-width: 100%;
        margin-top: 18px;
        padding: 13px 14px;
        border-radius: 10px;
        border: 1px solid #343a46;
        background: #101318;
        color: #ffffff;
        direction: ltr;
        text-align: left;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .form-link:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
    }

    .copy-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 220px;
        min-height: 48px;
        margin-top: 12px;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: #6c63ff;
        color: #ffffff;
        cursor: pointer;
        font-family: inherit;
        font-size: 15px;
        transition: 0.2s;
        touch-action: manipulation;
    }

    .copy-btn:hover {
        background: #5b52ed;
    }

    .copy-btn:active {
        transform: scale(0.98);
    }


    /* =========================
       موبایل
    ========================== */

    @media (max-width: 600px) {

        .success-page {
            min-height: 75vh;
            padding: 20px 10px;
        }

        .success-card {
            padding: 25px 15px;
            border-radius: 15px;
        }

        .success-icon {
            font-size: 44px;
            margin-bottom: 12px;
        }

        .success-title {
            font-size: 23px;
        }

        .success-text {
            font-size: 14px;
        }

        .form-link {
            padding: 12px;
            font-size: 13px;
        }

        .copy-btn {
            max-width: none;
            width: 100%;
            font-size: 15px;
        }
    }


    /* =========================
       موبایل خیلی کوچک
    ========================== */

    @media (max-width: 380px) {

        .success-page {
            padding: 15px 8px;
        }

        .success-card {
            padding: 22px 12px;
            border-radius: 13px;
        }

        .success-icon {
            font-size: 40px;
        }

        .success-title {
            font-size: 21px;
        }

        .form-link {
            font-size: 12px;
            padding: 11px 10px;
        }
    }

</style>


<div class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>


        <h1 class="success-title">
            فرم ساخته شد
        </h1>


        <p class="success-text">
            فرم «{{ form.title }}» با موفقیت ساخته شد.
        </p>


        <input
            id="formLink"
            class="form-link"
            type="text"
            readonly
            value="{{ request.scheme }}://{{ request.get_host }}{% url 'forms:fill_form' form.id %}"
        >


        <button
            type="button"
            class="copy-btn"
            id="copyButton"
            onclick="copyLink()"
        >
            کپی لینک
        </button>

    </div>

</div>


<script>

function copyLink() {

    const input =
        document.getElementById("formLink");

    const button =
        document.getElementById("copyButton");


    navigator.clipboard.writeText(
        input.value
    ).then(() => {

        button.textContent =
            "✓ لینک کپی شد";

        setTimeout(() => {

            button.textContent =
                "کپی لینک";

        }, 1800);

    }).catch(() => {

        input.focus();
        input.select();

        document.execCommand("copy");

        button.textContent =
            "✓ لینک کپی شد";

        setTimeout(() => {

            button.textContent =
                "کپی لینک";

        }, 1800);

    });
}

</script>

{% endblock %}
