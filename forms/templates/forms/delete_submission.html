{% extends "base.html" %}

{% block content %}

<style>

    /* =========================================================
       DELETE PAGE — با تم یکسان
    ========================================================= */

    .delete-page,
    .delete-page * {
        box-sizing: border-box;
    }


    .delete-page {

        /* دارک (پیش‌فرض) */

        --dp-card-1: #1a3055;
        --dp-card-2: #102040;
        --dp-border: rgba(244, 63, 94, 0.3);
        --dp-border-hover: rgba(244, 63, 94, 0.55);

        --dp-text: #e0eaff;
        --dp-text-soft: #c8d8f5;
        --dp-muted: #7a8fb5;
        --dp-dim: #5a6d8e;

        --dp-red: #fb7185;
        --dp-red-strong: #f43f5e;
        --dp-red-bg: rgba(244, 63, 94, 0.15);
        --dp-red-border: rgba(244, 63, 94, 0.4);

        --dp-shadow:
            0 30px 80px rgba(0, 0, 0, 0.55),
            0 0 60px rgba(244, 63, 94, 0.14),
            inset 0 1px 0 rgba(255, 200, 210, 0.16);


        position: relative;

        width: 100%;

        min-height: calc(100vh - 200px);

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 30px 20px 50px;

        color: var(--dp-text);

        transition: color 0.4s ease;
    }


    /* تم روشن */

    body.light .delete-page {

        --dp-card-1: #c8d8f2;
        --dp-card-2: #b0c4e8;
        --dp-border: rgba(220, 53, 69, 0.35);
        --dp-border-hover: rgba(220, 53, 69, 0.6);

        --dp-text: #0a1630;
        --dp-text-soft: #1a2b52;
        --dp-muted: #4a5c80;
        --dp-dim: #6a7ba0;

        --dp-red: #dc3545;
        --dp-red-strong: #b02a37;
        --dp-red-bg: rgba(220, 53, 69, 0.1);
        --dp-red-border: rgba(220, 53, 69, 0.35);

        --dp-shadow:
            0 30px 80px rgba(220, 53, 69, 0.2),
            0 0 60px rgba(220, 53, 69, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }


    /* =========================================================
       CARD
    ========================================================= */

    .delete-card {

        position: relative;

        z-index: 2;

        width: 100%;

        max-width: 560px;

        padding: 38px 34px 32px;

        text-align: center;

        border: 1.5px solid var(--dp-border);

        border-radius: 24px;

        background:
            linear-gradient(
                155deg,
                var(--dp-card-1) 0%,
                var(--dp-card-2) 100%
            );

        box-shadow: var(--dp-shadow);

        overflow: hidden;

        animation:
            deleteCardShow 0.75s
            cubic-bezier(.22, 1, .36, 1);

        transition:
            background 0.4s ease,
            border-color 0.4s ease,
            box-shadow 0.4s ease;
    }


    .delete-card::after {

        content: "";

        position: absolute;

        top: 0;
        right: 0;
        left: 0;

        height: 3px;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--dp-red),
                var(--dp-red-strong),
                var(--dp-red),
                transparent
            );

        background-size: 200% 100%;

        animation: deleteBorderShine 4s linear infinite;

        opacity: 0.9;
    }


    @keyframes deleteBorderShine {

        to { background-position: 200% 0; }
    }


    /* =========================================================
       ICON
    ========================================================= */

    .warning-icon-wrap {

        position: relative;

        width: 86px;
        height: 86px;

        margin: 0 auto 22px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 25px;

        background:
            linear-gradient(
                145deg,
                rgba(244, 63, 94, 0.18),
                rgba(190, 24, 93, 0.14)
            );

        border: 1.5px solid rgba(244, 63, 94, 0.4);

        box-shadow:
            inset 0 1px 0 rgba(255, 200, 210, 0.18),
            0 14px 35px rgba(244, 63, 94, 0.2);

        animation:
            warningShow 0.65s 0.05s both
            cubic-bezier(.22, 1, .36, 1);
    }


    .warning-icon-wrap::before {

        content: "";

        position: absolute;

        inset: -12px;

        border-radius: 33px;

        border: 1.5px solid rgba(244, 63, 94, 0.25);

        animation:
            warningRing 2.8s ease-out infinite;

        pointer-events: none;
    }


    @keyframes warningRing {

        0% {
            opacity: 0.6;
            transform: scale(0.92);
        }

        70% {
            opacity: 0;
            transform: scale(1.18);
        }

        100% {
            opacity: 0;
            transform: scale(1.18);
        }
    }


    .warning-icon {

        position: relative;

        z-index: 2;

        width: 56px;
        height: 56px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 17px;

        background:
            linear-gradient(
                135deg,
                rgba(244, 63, 94, 0.3),
                rgba(190, 24, 93, 0.22)
            );

        color: var(--dp-red);

        font-size: 28px;

        font-weight: 900;

        box-shadow:
            0 0 30px rgba(244, 63, 94, 0.35),
            inset 0 1px 0 rgba(255, 200, 210, 0.25);
    }


    /* =========================================================
       TITLE
    ========================================================= */

    .delete-title {

        position: relative;

        z-index: 2;

        margin: 0 0 12px;

        color: var(--dp-text);

        font-size: 27px;

        line-height: 1.5;

        font-weight: 800;

        letter-spacing: -0.6px;

        animation:
            deleteTextShow 0.6s 0.12s both;
    }


    .delete-question {

        position: relative;

        z-index: 2;

        margin: 0 auto;

        max-width: 460px;

        color: var(--dp-muted);

        line-height: 2;

        font-size: 13px;

        font-weight: 500;

        overflow-wrap: anywhere;

        animation:
            deleteTextShow 0.6s 0.19s both;
    }


    .delete-question strong {

        color: var(--dp-text-soft);

        font-weight: 800;
    }


    /* =========================================================
       WARNING BOX
    ========================================================= */

    .delete-warning {

        position: relative;

        z-index: 2;

        display: flex;

        align-items: flex-start;

        gap: 12px;

        margin: 24px 0 28px;

        padding: 16px 18px;

        text-align: right;

        border: 1.5px solid var(--dp-red-border);

        border-radius: 14px;

        background: var(--dp-red-bg);

        color: var(--dp-text-soft);

        font-size: 12.5px;

        font-weight: 600;

        line-height: 1.95;

        animation:
            warningBoxShow 0.55s 0.24s both;
    }


    body.light .delete-warning {
        color: #8a2a3a;
    }


    .warning-icon-small {

        flex-shrink: 0;

        width: 30px;
        height: 30px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 9px;

        background: rgba(244, 63, 94, 0.2);

        color: var(--dp-red);

        font-size: 15px;

        font-weight: 900;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .delete-form {

        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 12px;

        width: 100%;

        flex-wrap: wrap;

        animation:
            buttonsShow 0.6s 0.30s both;
    }


    .delete-btn,
    .cancel-btn {

        position: relative;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        min-height: 52px;

        padding: 14px 24px;

        border-radius: 12px;

        font-family: 'Vazirmatn', Tahoma, sans-serif;

        font-size: 13.5px;

        font-weight: 800;

        cursor: pointer;

        text-decoration: none;

        overflow: hidden;

        transition:
            transform 0.25s ease,
            background 0.25s ease,
            border-color 0.25s ease,
            box-shadow 0.25s ease,
            color 0.25s ease;
    }


    /* DELETE BUTTON */

    .delete-btn {

        flex: 1 1 220px;

        border: none;

        background:
            linear-gradient(
                135deg,
                #dc2949,
                #b81f3d
            );

        color: #ffe4e9;

        box-shadow:
            0 12px 30px rgba(244, 63, 94, 0.4),
            inset 0 1px 0 rgba(255, 200, 210, 0.2);
    }


    .delete-btn::before {

        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                110deg,
                transparent 20%,
                rgba(255, 200, 210, 0.3) 50%,
                transparent 80%
            );

        transform: translateX(120%);

        transition: transform 0.65s ease;
    }


    .delete-btn span {
        position: relative;
        z-index: 2;
    }


    .delete-btn:hover {

        transform: translateY(-3px);

        color: #ffd0d8;

        box-shadow:
            0 20px 45px rgba(244, 63, 94, 0.6),
            0 0 45px rgba(244, 63, 94, 0.4);

        filter: brightness(1.08);
    }


    .delete-btn:hover::before {
        transform: translateX(-120%);
    }


    .delete-btn:active {
        transform: translateY(0) scale(0.985);
    }


    /* CANCEL BUTTON */

    .cancel-btn {

        flex: 0 0 auto;

        min-width: 130px;

        border: 1.5px solid rgba(109, 164, 255, 0.3);

        background: rgba(109, 164, 255, 0.1);

        color: var(--dp-text-soft);
    }


    body.light .cancel-btn {

        background: rgba(58, 109, 224, 0.08);

        border-color: rgba(58, 109, 224, 0.3);
    }


    .cancel-btn:hover {

        transform: translateY(-3px);

        background: rgba(109, 164, 255, 0.2);

        border-color: rgba(109, 164, 255, 0.6);

        color: var(--dp-text);

        box-shadow: 0 12px 28px rgba(74, 125, 232, 0.28);
    }


    .cancel-btn:active {
        transform: translateY(0) scale(0.985);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .delete-footer {

        position: relative;

        z-index: 2;

        margin-top: 24px;

        padding-top: 18px;

        border-top: 1.5px solid var(--dp-border);

        color: var(--dp-dim);

        font-size: 10.5px;

        font-weight: 500;

        line-height: 1.9;

        animation:
            deleteTextShow 0.6s 0.4s both;
    }


    /* =========================================================
       FOCUS
    ========================================================= */

    .delete-btn:focus-visible,
    .cancel-btn:focus-visible {

        outline: 3px solid rgba(244, 63, 94, 0.4);

        outline-offset: 3px;
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes deleteCardShow {

        from {
            opacity: 0;
            transform: translateY(28px) scale(0.975);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }


    @keyframes warningShow {

        from {
            opacity: 0;
            transform: scale(0.72) rotate(-6deg);
        }

        to {
            opacity: 1;
            transform: scale(1) rotate(0);
        }
    }


    @keyframes warningBoxShow {

        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    @keyframes deleteTextShow {

        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    @keyframes buttonsShow {

        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 800px) {

        .delete-page {
            padding: 24px 14px 40px;
        }


        .delete-card {
            padding: 32px 24px 26px;
            border-radius: 20px;
        }


        .delete-title {
            font-size: 23px;
        }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

        .delete-page {
            padding: 20px 12px 35px;
            min-height: auto;
        }


        .delete-card {
            max-width: 100%;
            padding: 28px 18px 24px;
            border-radius: 18px;
        }


        .warning-icon-wrap {

            width: 72px;
            height: 72px;
            margin-bottom: 18px;
            border-radius: 21px;
        }


        .warning-icon {

            width: 46px;
            height: 46px;
            border-radius: 14px;
            font-size: 23px;
        }


        .delete-title {

            font-size: 21px;
            margin-bottom: 10px;
        }


        .delete-question {
            font-size: 12.5px;
            line-height: 2;
        }


        .delete-warning {

            margin: 20px 0 22px;
            padding: 14px 15px;
            font-size: 12px;
        }


        .warning-icon-small {

            width: 28px;
            height: 28px;
            font-size: 14px;
        }


        .delete-form {

            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }


        .delete-btn,
        .cancel-btn {

            width: 100%;
            flex: 1 1 auto;
            min-height: 52px;
            font-size: 13.5px;
        }


        .cancel-btn {
            min-width: 0;
        }


        .delete-footer {

            margin-top: 20px;
            padding-top: 16px;
            font-size: 10px;
        }
    }


    /* =========================================================
       TINY PHONES
    ========================================================= */

    @media (max-width: 380px) {

        .delete-page {
            padding: 14px 8px 28px;
        }


        .delete-card {
            padding: 22px 14px 20px;
            border-radius: 16px;
        }


        .warning-icon-wrap {

            width: 64px;
            height: 64px;
            border-radius: 18px;
        }


        .warning-icon {

            width: 42px;
            height: 42px;
            border-radius: 13px;
            font-size: 21px;
        }


        .delete-title {
            font-size: 19px;
        }


        .delete-question {
            font-size: 11.5px;
        }


        .delete-warning {
            font-size: 11px;
        }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        .delete-page *,
        .delete-page *::before,
        .delete-page *::after {

            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

</style>



<div class="delete-page">


    <section class="delete-card">


        <!-- ICON -->

        <div class="warning-icon-wrap">

            <div class="warning-icon">
                !
            </div>

        </div>



        <!-- TITLE -->

        <h1 class="delete-title">
            حذف فرم
        </h1>



        <!-- QUESTION -->

        <p class="delete-question">

            آیا از حذف فرم

            <strong>
                «{{ form.title }}»
            </strong>

            مطمئن هستید؟

        </p>



        <!-- WARNING -->

        <div class="delete-warning">

            <div class="warning-icon-small">
                !
            </div>

            <div>

                با حذف این فرم، سؤال‌ها و پاسخ‌های ثبت‌شده
                آن نیز حذف خواهند شد و این عملیات قابل بازگشت نیست.

            </div>

        </div>



        <!-- ACTIONS -->

        <form
            method="post"
            class="delete-form"
        >

            {% csrf_token %}


            <button
                type="submit"
                class="delete-btn"
            >

                <span>
                    🗑 حذف فرم برای همیشه
                </span>

            </button>


            <a
                href="{% url 'forms:form_list' %}"
                class="cancel-btn"
            >
                انصراف
            </a>

        </form>



        <!-- FOOTER -->

        <div class="delete-footer">

            کانون فرهنگی تربیتی رویش

        </div>


    </section>


</div>

{% endblock %}
