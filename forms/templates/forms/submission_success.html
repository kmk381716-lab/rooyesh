
{% extends "base.html" %}

{% block content %}

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
    }

    .success-page {
        width: 100%;
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: #0d0f14;
    }

    .success-card {
        width: 100%;
        max-width: 550px;
        background: #171a21;
        border: 1px solid #282d36;
        border-radius: 20px;
        padding: 40px 30px;
        text-align: center;
        color: #ffffff;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .success-icon {
        font-size: 55px;
        line-height: 1;
        margin-bottom: 18px;
    }

    .success-title {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.6;
    }

    .success-text {
        margin: 0;
        color: #8d96a5;
        line-height: 2;
        font-size: 15px;
        overflow-wrap: anywhere;
        word-break: break-word;
    }


    /* =========================
       موبایل
    ========================== */

    @media (max-width: 600px) {

        .success-page {
            min-height: 75vh;
            padding: 20px 10px;
        }

        .success-card {
            padding: 28px 16px;
            border-radius: 15px;
        }

        .success-icon {
            font-size: 45px;
            margin-bottom: 14px;
        }

        .success-title {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .success-text {
            font-size: 14px;
            line-height: 1.9;
        }

    }


    /* =========================
       موبایل خیلی کوچک
    ========================== */

    @media (max-width: 380px) {

        .success-page {
            padding: 15px 8px;
        }

        .success-card {
            padding: 24px 12px;
            border-radius: 13px;
        }

        .success-icon {
            font-size: 40px;
        }

        .success-title {
            font-size: 21px;
        }

        .success-text {
            font-size: 13px;
        }

    }

</style>


<div class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>


        <h1 class="success-title">
            پاسخ شما ثبت شد
        </h1>


        <p class="success-text">
            پاسخ شما برای فرم
            «{{ form.title }}»
            با موفقیت ثبت شد.
        </p>

    </div>

</div>

{% endblock %}
