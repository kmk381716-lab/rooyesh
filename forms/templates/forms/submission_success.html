{% extends "base.html" %}

{% block title %}
    ثبت پاسخ | کانون رویش
{% endblock %}

{% block content %}

<style>

    .success-page,
    .success-page * {
        box-sizing: border-box;
    }


    .success-page {

        --sp-card-1: #1a3055;
        --sp-card-2: #102040;
        --sp-card-inner: rgba(20, 32, 58, 0.85);
        --sp-card-inner-hover: rgba(28, 44, 74, 0.95);

        --sp-border: rgba(109, 164, 255, 0.28);
        --sp-border-inner: rgba(109, 164, 255, 0.16);

        --sp-text: #e0eaff;
        --sp-text-soft: #c8d8f5;
        --sp-muted: #7a8fb5;
        --sp-dim: #5a6d8e;

        --sp-blue: #4a7de8;
        --sp-blue-light: #6da4ff;
        --sp-cyan: #4cc9e8;
        --sp-green: #4ade80;
        --sp-green-bg: rgba(74, 222, 128, 0.15);
        --sp-green-border: rgba(74, 222, 128, 0.4);

        --sp-shadow:
            0 30px 80px rgba(0, 0, 0, 0.5),
            0 0 60px rgba(74, 125, 232, 0.14),
            inset 0 1px 0 rgba(180, 220, 255, 0.16);


        position: relative;

        width: 100%;

        min-height: calc(100vh - 200px);

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 40px 20px 60px;

        color: var(--sp-text);

        transition: color 0.4s ease;
    }


    body.light .success-page {

        --sp-card-1: #c8d8f2;
        --sp-card-2: #b0c4e8;
        --sp-card-inner: rgba(240, 245, 255, 0.75);
        --sp-card-inner-hover: rgba(255, 255, 255, 0.95);

        --sp-border: rgba(58, 109, 224, 0.35);
        --sp-border-inner: rgba(58, 109, 224, 0.2);

        --sp-text: #0a1630;
        --sp-text-soft: #1a2b52;
        --sp-muted: #4a5c80;
        --sp-dim: #6a7ba0;

        --sp-blue: #2a6bff;
        --sp-blue-light: #2a6bff;
        --sp-cyan: #2e7bc4;
        --sp-green: #1e9668;
        --sp-green-bg: rgba(30, 150, 104, 0.12);
        --sp-green-border: rgba(30, 150, 104, 0.35);

        --sp-shadow:
            0 30px 80px rgba(58, 109, 224, 0.22),
            0 0 60px rgba(58, 109, 224, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }


    .success-card {

        position: relative;

        z-index: 2;

        width: 100%;

        max-width: 580px;

        padding: 42px 34px 32px;

        text-align: center;

        border: 1.5px solid var(--sp-border);

        border-radius: 26px;

        background:
            linear-gradient(
                155deg,
                var(--sp-card-1) 0%,
                var(--sp-card-2) 100%
            );

        box-shadow: var(--sp-shadow);

        overflow: hidden;

        animation: successCardShow 0.75s cubic-bezier(.22, 1, .36, 1);
    }


    .success-card::after {

        content: "";

        position: absolute;

        top: 0;
        right: 0;
        left: 0;

        height: 3px;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--sp-green),
                var(--sp-cyan),
                var(--sp-blue-light),
                transparent
            );

        background-size: 200% 100%;

        animation: successBorderShine 4s linear infinite;
    }


    @keyframes successBorderShine {

        to { background-position: 200% 0; }
    }


    @keyframes successCardShow {

        from { opacity: 0; transform: translateY(28px) scale(0.975); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }


    .success-icon-wrap {

        position: relative;

        display: flex;

        align-items: center;

        justify-content: center;

        width: 96px;
        height: 96px;

        margin: 0 auto 24px;

        border-radius: 28px;

        background:
            linear-gradient(
                145deg,
                rgba(74, 222, 128, 0.22),
                rgba(76, 201, 232, 0.18)
            );

        border: 1.5px solid rgba(74, 222, 128, 0.45);

        box-shadow:
            inset 0 1px 0 rgba(180, 255, 220, 0.22),
            0 16px 38px rgba(74, 222, 128, 0.25);

        animation: successIconShow 0.65s 0.06s both cubic-bezier(.22, 1, .36, 1);
    }


    .success-icon-wrap::before {

        content: "";

        position: absolute;

        inset: -13px;

        border-radius: 36px;

        border: 1.5px solid rgba(74, 222, 128, 0.28);

        animation: successRing 2.8s ease-out infinite;

        pointer-events: none;
    }


    @keyframes successRing {

        0% { opacity: 0.65; transform: scale(0.9); }
        70% { opacity: 0; transform: scale(1.18); }
        100% { opacity: 0; transform: scale(1.18); }
    }


    @keyframes successIconShow {

        from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
    }


    .success-icon {

        position: relative;

        z-index: 2;

        display: flex;

        align-items: center;

        justify-content: center;

        width: 62px;
        height: 62px;

        border-radius: 20px;

        background:
            linear-gradient(
                135deg,
                rgba(74, 222, 128, 0.32),
                rgba(76, 201, 232, 0.22)
            );

        color: #6ee7b7;

        box-shadow:
            0 0 35px rgba(74, 222, 128, 0.4),
            inset 0 1px 0 rgba(180, 255, 220, 0.28);
    }


    body.light .success-icon {
        color: #167a52;
    }


    .success-icon svg {

        width: 34px;
        height: 34px;

        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;

        animation: successDraw 0.65s 0.25s both;
    }


    @keyframes successDraw {

        from { opacity: 0; transform: scale(0.7); }
        to { opacity: 1; transform: scale(1); }
    }


    .success-title {

        position: relative;

        z-index: 2;

        margin: 0 0 14px;

        color: var(--sp-text);

        font-size: 26px;

        line-height: 1.5;

        font-weight: 800;

        letter-spacing: -0.5px;

        animation: successTextShow 0.6s 0.15s both;
    }


    .success-text {

        position: relative;

        z-index: 2;

        max-width: 460px;

        margin: 0 auto;

        color: var(--sp-muted);

        font-size: 14px;

        font-weight: 500;

        line-height: 2.05;

        overflow-wrap: anywhere;

        word-break: break-word;

        animation: successTextShow 0.6s 0.22s both;
    }


    .success-text strong {

        color: var(--sp-text-soft);

        font-weight: 800;
    }


    @keyframes successTextShow {

        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }


    .success-status {

        position: relative;

        z-index: 2;

        display: inline-flex;

        align-items: center;

        gap: 8px;

        margin: 26px auto 0;

        padding: 10px 16px;

        border-radius: 11px;

        background: var(--sp-green-bg);

        border: 1.5px solid var(--sp-green-border);

        color: var(--sp-green);

        font-size: 12.5px;

        font-weight: 800;

        line-height: 1.6;

        animation: successTextShow 0.6s 0.28s both;
    }


    body.light .success-status {
        color: #167a52;
    }


    .success-status-dot {

        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: var(--sp-green);

        box-shadow: 0 0 12px rgba(74, 222, 128, 0.85);

        animation: successDot 2s ease-in-out infinite;
    }


    @keyframes successDot {

        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
    }


    .success-footer {

        position: relative;

        z-index: 2;

        margin-top: 28px;

        padding-top: 20px;

        border-top: 1.5px solid var(--sp-border);

        color: var(--sp-dim);

        font-size: 11.5px;

        font-weight: 500;

        line-height: 1.9;

        animation: successTextShow 0.6s 0.34s both;
    }


    @media (max-width: 600px) {

        .success-page {
            padding: 20px 12px 35px;
            min-height: auto;
        }


        .success-card {
            padding: 30px 20px 26px;
            border-radius: 20px;
        }


        .success-icon-wrap {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            border-radius: 24px;
        }


        .success-icon {
            width: 52px;
            height: 52px;
            border-radius: 17px;
        }


        .success-icon svg {
            width: 28px;
            height: 28px;
        }


        .success-title {
            font-size: 21px;
            margin-bottom: 12px;
        }


        .success-text {
            font-size: 13px;
            line-height: 1.95;
        }


        .success-status {
            margin-top: 22px;
            padding: 9px 14px;
            font-size: 11.5px;
        }


        .success-footer {
            margin-top: 24px;
            padding-top: 16px;
            font-size: 10.5px;
        }
    }


    @media (max-width: 380px) {

        .success-page {
            padding: 14px 8px 28px;
        }


        .success-card {
            padding: 24px 15px 22px;
            border-radius: 18px;
        }


        .success-icon-wrap {
            width: 72px;
            height: 72px;
            border-radius: 22px;
        }


        .success-icon {
            width: 46px;
            height: 46px;
            border-radius: 15px;
        }


        .success-icon svg {
            width: 24px;
            height: 24px;
        }


        .success-title {
            font-size: 19px;
        }


        .success-text {
            font-size: 12.5px;
        }
    }


    @media (prefers-reduced-motion: reduce) {

        .success-page *,
        .success-page *::before,
        .success-page *::after {

            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

</style>



<div class="success-page">

    <section class="success-card">


        <div class="success-icon-wrap">

            <div class="success-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                >

                    <path d="M5 12.5L9.2 16.5L19 7.5" />

                </svg>

            </div>

        </div>



        <h1 class="success-title">
            پاسخ شما با موفقیت ثبت شد
        </h1>


        <p class="success-text">

            پاسخ شما برای فرم

            <strong>
                «{{ form.title }}»
            </strong>

            با موفقیت ثبت شد.

        </p>



        <div class="success-status">

            <span class="success-status-dot"></span>

            ثبت پاسخ با موفقیت انجام شد

        </div>



        <div class="success-footer">
            کانون فرهنگی تربیتی رویش
        </div>


    </section>

</div>

{% endblock %}
