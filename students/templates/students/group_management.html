
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        مدیریت گروه‌ها | کانون رویش
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {

            --bg-main: #050711;
            --bg-secondary: #0c1220;

            --card: rgba(16, 24, 40, .86);

            --text: #f8fafc;
            --soft: #94a3b8;
            --muted: #64748b;

            --blue: #4f8cff;
            --purple: #725cff;

            --green: #35d49a;
            --green-dark: #239d75;

            --red: #fb7185;
            --red-dark: #d94864;

            --border: rgba(255,255,255,.08);
        }


        /* =========================
           BODY
        ========================= */

        body {

            margin: 0;

            min-height: 100vh;

            padding:
                24px
                16px;

            font-family:
                Tahoma,
                "Segoe UI",
                sans-serif;

            color:
                var(--text);

            background:

                radial-gradient(
                    circle at 8% 8%,
                    rgba(79,140,255,.11),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 92% 18%,
                    rgba(114,92,255,.10),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(53,212,154,.045),
                    transparent 32%
                ),

                linear-gradient(
                    145deg,
                    var(--bg-main),
                    var(--bg-secondary)
                );

            overflow-x:
                hidden;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        body::before,
        body::after {

            content:
                "";

            position:
                fixed;

            width:
                280px;

            height:
                280px;

            border-radius:
                50%;

            filter:
                blur(85px);

            pointer-events:
                none;

            z-index:
                0;

            animation:
                floatingGlow
                11s
                ease-in-out
                infinite
                alternate;
        }


        body::before {

            top:
                -110px;

            right:
                -100px;

            background:
                rgba(79,140,255,.09);
        }


        body::after {

            bottom:
                -120px;

            left:
                -100px;

            background:
                rgba(114,92,255,.08);

            animation-delay:
                -4s;
        }


        @keyframes floatingGlow {

            from {

                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            to {

                transform:
                    translate3d(25px,20px,0)
                    scale(1.12);
            }
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            position:
                relative;

            z-index:
                1;

            width:
                100%;

            max-width:
                900px;

            margin:
                25px
                auto;

            animation:
                pageEnter
                .7s
                cubic-bezier(.2,.8,.2,1);
        }


        @keyframes pageEnter {

            from {

                opacity:
                    0;

                transform:
                    translateY(25px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                18px;

            margin-bottom:
                24px;

            padding:
                18px
                20px;

            border:
                1px solid
                var(--border);

            border-radius:
                19px;

            background:
                rgba(16,24,40,.62);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 18px 50px
                rgba(0,0,0,.22);
        }


        .title-area {

            display:
                flex;

            align-items:
                center;

            gap:
                13px;
        }


        .header-icon {

            width:
                48px;

            height:
                48px;

            flex-shrink:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                14px;

            background:

                linear-gradient(
                    135deg,
                    rgba(79,140,255,.15),
                    rgba(114,92,255,.15)
                );

            border:
                1px solid
                rgba(79,140,255,.18);

            box-shadow:
                0 10px 30px
                rgba(79,140,255,.09);

            font-size:
                21px;

            animation:
                iconPulse
                3.2s
                ease-in-out
                infinite;
        }


        @keyframes iconPulse {

            0%,
            100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-2px);
            }
        }


        .header h1 {

            margin:
                0 0 5px;

            font-size:
                22px;

            line-height:
                1.3;
        }


        .header-description {

            color:
                var(--soft);

            font-size:
                10px;

            line-height:
                1.8;
        }


        /* =========================
           ADD BUTTON
        ========================= */

        .add-button {

            position:
                relative;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                44px;

            padding:
                0
                17px;

            border:
                1px solid
                rgba(79,140,255,.18);

            border-radius:
                11px;

            background:

                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            color:
                white;

            font-size:
                10px;

            font-weight:
                800;

            text-decoration:
                none;

            box-shadow:
                0 12px 28px
                rgba(79,140,255,.16);

            overflow:
                hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }


        .add-button::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            right:
                -100%;

            width:
                45%;

            height:
                100%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.22),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                right .6s ease;
        }


        .add-button:hover::before {

            right:
                140%;
        }


        .add-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 17px 35px
                rgba(79,140,255,.23);
        }


        /* =========================
           GROUPS
        ========================= */

        .groups {

            display:
                grid;

            gap:
                12px;
        }


        .group-card {

            position:
                relative;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                18px;

            padding:
                18px;

            border:
                1px solid
                var(--border);

            border-radius:
                16px;

            background:

                linear-gradient(
                    145deg,
                    rgba(18,27,46,.78),
                    rgba(10,15,28,.76)
                );

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            box-shadow:
                0 10px 35px
                rgba(0,0,0,.18);

            overflow:
                hidden;

            animation:
                cardEnter
                .55s
                ease
                both;

            transition:
                transform .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }


        .group-card:nth-child(1) {
            animation-delay: .04s;
        }

        .group-card:nth-child(2) {
            animation-delay: .08s;
        }

        .group-card:nth-child(3) {
            animation-delay: .12s;
        }

        .group-card:nth-child(4) {
            animation-delay: .16s;
        }

        .group-card:nth-child(5) {
            animation-delay: .20s;
        }

        .group-card:nth-child(6) {
            animation-delay: .24s;
        }


        @keyframes cardEnter {

            from {

                opacity:
                    0;

                transform:
                    translateY(12px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        .group-card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            right:
                0;

            width:
                3px;

            height:
                100%;

            background:
                linear-gradient(
                    180deg,
                    var(--blue),
                    var(--purple)
                );

            opacity:
                .6;
        }


        .group-card:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(255,255,255,.12);

            box-shadow:
                0 16px 45px
                rgba(0,0,0,.25);
        }


        /* =========================
           GROUP INFO
        ========================= */

        .group-info {

            min-width:
                0;
        }


        .group-name {

            margin-bottom:
                7px;

            color:
                #f8fafc;

            font-size:
                16px;

            font-weight:
                900;

            word-break:
                break-word;
        }


        .group-status {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            font-size:
                9.5px;

            font-weight:
                700;
        }


        .group-status::before {

            content:
                "";

            width:
                7px;

            height:
                7px;

            border-radius:
                50%;

            box-shadow:
                0 0 10px currentColor;
        }


        .active {

            color:
                var(--green);
        }


        .active::before {

            background:
                var(--green);
        }


        .inactive {

            color:
                var(--red);
        }


        .inactive::before {

            background:
                var(--red);
        }


        /* =========================
           ACTIONS
        ========================= */

        .actions {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            flex-shrink:
                0;
        }


        .actions form {

            margin:
                0;
        }


        .edit-button,
        .toggle-button {

            min-height:
                39px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                0
                13px;

            border:
                1px solid
                transparent;

            border-radius:
                10px;

            font-family:
                inherit;

            font-size:
                9.5px;

            font-weight:
                800;

            text-decoration:
                none;

            cursor:
                pointer;

            transition:
                transform .22s ease,
                background .22s ease,
                border-color .22s ease,
                box-shadow .22s ease;
        }


        /* =========================
           EDIT
        ========================= */

        .edit-button {

            color:
                #dbe5f4;

            background:
                rgba(255,255,255,.045);

            border-color:
                rgba(255,255,255,.08);
        }


        .edit-button:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,.075);

            border-color:
                rgba(255,255,255,.13);

            box-shadow:
                0 9px 20px
                rgba(0,0,0,.16);
        }


        /* =========================
           TOGGLE
        ========================= */

        .toggle-button {

            color:
                white;

            background:

                linear-gradient(
                    135deg,
                    rgba(79,140,255,.9),
                    rgba(114,92,255,.9)
                );

            border-color:
                rgba(100,130,255,.12);

            box-shadow:
                0 8px 20px
                rgba(79,140,255,.10);
        }


        .toggle-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(79,140,255,.17);
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            padding:
                55px
                25px;

            border:
                1px solid
                var(--border);

            border-radius:
                18px;

            background:
                rgba(16,24,40,.70);

            color:
                var(--soft);

            text-align:
                center;

            font-size:
                11px;

            line-height:
                2;

            box-shadow:
                0 20px 55px
                rgba(0,0,0,.18);

            animation:
                fadeUp
                .6s
                ease;
        }


        @keyframes fadeUp {

            from {

                opacity:
                    0;

                transform:
                    translateY(12px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {

                padding:
                    12px;
            }


            .container {

                margin:
                    8px
                    auto;
            }


            .header {

                flex-direction:
                    column;

                align-items:
                    stretch;

                padding:
                    18px
                    16px;

                border-radius:
                    17px;
            }


            .title-area {

                align-items:
                    center;
            }


            .header h1 {

                font-size:
                    20px;
            }


            .header-description {

                font-size:
                    9.5px;
            }


            .add-button {

                width:
                    100%;
            }


            .group-card {

                flex-direction:
                    column;

                align-items:
                    stretch;

                padding:
                    17px;
            }


            .group-name {

                font-size:
                    15px;
            }


            .actions {

                width:
                    100%;
            }


            .edit-button,
            .toggle-button {

                flex:
                    1;

                width:
                    100%;
            }

        }


        @media (max-width: 420px) {

            body {

                padding:
                    7px;
            }


            .container {

                margin:
                    5px
                    auto;
            }


            .header {

                padding:
                    16px
                    13px;

                margin-bottom:
                    15px;
            }


            .header-icon {

                width:
                    43px;

                height:
                    43px;

                border-radius:
                    12px;

                font-size:
                    18px;
            }


            .header h1 {

                font-size:
                    18px;
            }


            .header-description {

                font-size:
                    9px;
            }


            .add-button {

                min-height:
                    45px;

                font-size:
                    10px;
            }


            .group-card {

                padding:
                    15px;

                border-radius:
                    14px;
            }


            .group-name {

                font-size:
                    14px;
            }


            .group-status {

                font-size:
                    9px;
            }


            .edit-button,
            .toggle-button {

                min-height:
                    42px;

                font-size:
                    9px;

                border-radius:
                    9px;
            }


            .empty {

                padding:
                    45px
                    18px;

                border-radius:
                    15px;

                font-size:
                    10px;
            }

        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="title-area">

            <div class="header-icon">
                👥
            </div>

            <div>

                <h1>
                    مدیریت گروه‌ها
                </h1>

                <div class="header-description">
                    ایجاد، ویرایش و مدیریت وضعیت گروه‌های دانش‌آموزان
                </div>

            </div>

        </div>


        <a
            href="{% url 'students:group_create' %}"
            class="add-button"
        >
            + افزودن گروه
        </a>

    </div>


    {% if groups %}

        <div class="groups">

            {% for group in groups %}

                <div class="group-card">


                    <div class="group-info">

                        <div class="group-name">
                            {{ group.name }}
                        </div>


                        {% if group.is_active %}

                            <div class="group-status active">
                                فعال
                            </div>

                        {% else %}

                            <div class="group-status inactive">
                                غیرفعال
                            </div>

                        {% endif %}

                    </div>


                    <div class="actions">


                        <a
                            href="{% url 'students:group_edit' group.id %}"
                            class="edit-button"
                        >
                            ویرایش
                        </a>


                        <form
                            method="post"
                            action="{% url 'students:group_toggle' group.id %}"
                        >

                            {% csrf_token %}

                            <button
                                type="submit"
                                class="toggle-button"
                            >

                                {% if group.is_active %}

                                    غیرفعال کردن

                                {% else %}

                                    فعال کردن

                                {% endif %}

                            </button>

                        </form>


                    </div>


                </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="empty">

            هنوز هیچ گروهی ساخته نشده است.

        </div>

    {% endif %}


</div>


</body>

</html>
