<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ثبت پرداخت | کانون رویش
    </title>

    <style>

        * {
            box-sizing: border-box;
        }


        :root {

            --bg-1: #050711;
            --bg-2: #0b1020;

            --card-1: rgba(18, 26, 45, .90);
            --card-2: rgba(10, 15, 28, .86);

            --text: #f8fafc;
            --soft: #94a3b8;
            --muted: #66748a;

            --green: #35d49a;
            --green-2: #22b77f;

            --blue: #4f8cff;
            --purple: #715dff;

            --danger: #fb7185;

            --border: rgba(255,255,255,.08);
        }


        /* =========================
           BODY
        ========================= */

        body {

            margin: 0;

            min-height: 100vh;

            padding:
                20px
                15px;

            font-family:
                Tahoma,
                "Segoe UI",
                sans-serif;

            color:
                var(--text);

            background:

                radial-gradient(
                    circle at 8% 10%,
                    rgba(79,140,255,.11),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 92% 20%,
                    rgba(113,93,255,.10),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(53,212,154,.06),
                    transparent 32%
                ),

                linear-gradient(
                    145deg,
                    var(--bg-1),
                    var(--bg-2)
                );

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        body::before,
        body::after {

            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            filter:
                blur(85px);

            pointer-events:
                none;

            z-index: 0;

            animation:
                floatingGlow
                11s
                ease-in-out
                infinite
                alternate;
        }


        body::before {

            top: -130px;
            right: -100px;

            background:
                rgba(79,140,255,.10);
        }


        body::after {

            bottom: -140px;
            left: -120px;

            background:
                rgba(53,212,154,.075);

            animation-delay:
                -4s;
        }


        @keyframes floatingGlow {

            from {

                transform:
                    translate3d(0,0,0)
                    scale(1);
            }

            to {

                transform:
                    translate3d(25px,20px,0)
                    scale(1.12);
            }
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            position:
                relative;

            z-index:
                1;

            width:
                100%;

            max-width:
                620px;

            margin:
                35px
                auto;

            animation:
                pageEnter
                .7s
                cubic-bezier(.2,.8,.2,1);
        }


        @keyframes pageEnter {

            from {

                opacity:
                    0;

                transform:
                    translateY(25px)
                    scale(.975);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           CARD
        ========================= */

        .card {

            position:
                relative;

            padding:
                32px;

            border:
                1px solid
                var(--border);

            border-radius:
                24px;

            background:

                linear-gradient(
                    145deg,
                    var(--card-1),
                    var(--card-2)
                );

            backdrop-filter:
                blur(24px);

            -webkit-backdrop-filter:
                blur(24px);

            box-shadow:

                0 35px 90px
                rgba(0,0,0,.46),

                inset 0 1px 0
                rgba(255,255,255,.035);

            overflow:
                hidden;

            transition:
                transform .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }


        .card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            right:
                0;

            left:
                0;

            height:
                1px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(53,212,154,.65),
                    rgba(79,140,255,.55),
                    transparent
                );
        }


        .card::after {

            content:
                "";

            position:
                absolute;

            width:
                190px;

            height:
                190px;

            left:
                -110px;

            bottom:
                -120px;

            border-radius:
                50%;

            background:
                rgba(53,212,154,.045);

            filter:
                blur(35px);

            pointer-events:
                none;
        }


        .card:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(255,255,255,.12);

            box-shadow:

                0 42px 110px
                rgba(0,0,0,.52),

                inset 0 1px 0
                rgba(255,255,255,.045);
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            margin-bottom:
                24px;
        }


        .header-icon {

            width:
                53px;

            height:
                53px;

            flex-shrink:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                16px;

            background:

                linear-gradient(
                    135deg,
                    rgba(53,212,154,.15),
                    rgba(79,140,255,.15)
                );

            border:
                1px solid
                rgba(74,205,162,.18);

            box-shadow:

                0 12px 32px
                rgba(53,212,154,.09);

            font-size:
                22px;

            animation:
                iconPulse
                3s
                ease-in-out
                infinite;
        }


        @keyframes iconPulse {

            0%,
            100% {

                transform:
                    translateY(0);

                box-shadow:
                    0 12px 30px
                    rgba(53,212,154,.08);
            }

            50% {

                transform:
                    translateY(-2px);

                box-shadow:
                    0 16px 38px
                    rgba(53,212,154,.16);
            }
        }


        h1 {

            margin:
                0 0 6px;

            font-size:
                24px;

            line-height:
                1.3;

            letter-spacing:
                -.35px;
        }


        .student {

            margin:
                0;

            color:
                var(--soft);

            font-size:
                10.5px;

            line-height:
                1.8;
        }


        .student strong {

            color:
                #dbe7f5;

            font-weight:
                800;
        }


        /* =========================
           CHARGE BOX
        ========================= */

        .charge-box {

            position:
                relative;

            margin-bottom:
                23px;

            padding:
                18px;

            border-radius:
                16px;

            background:

                linear-gradient(
                    145deg,
                    rgba(79,140,255,.085),
                    rgba(113,93,255,.045)
                );

            border:
                1px solid
                rgba(79,140,255,.13);

            overflow:
                hidden;

            animation:
                fadeUp
                .6s
                ease
                both;
        }


        .charge-box::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            right:
                -170px;

            width:
                200px;

            height:
                100%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.045),
                    transparent
                );

            transform:
                skewX(-20deg);

            animation:
                chargeShine
                4.5s
                ease-in-out
                infinite;
        }


        @keyframes chargeShine {

            0% {

                right:
                    -220px;
            }

            45%,
            100% {

                right:
                    125%;
            }
        }


        .charge-title {

            position:
                relative;

            z-index:
                1;

            margin-bottom:
                9px;

            color:
                #f1f5f9;

            font-size:
                14px;

            font-weight:
                900;
        }


        .charge-amount {

            position:
                relative;

            z-index:
                1;

            color:
                #9bbdff;

            font-size:
                10.5px;

            line-height:
                1.9;
        }


        .remaining {

            position:
                relative;

            z-index:
                1;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            margin-top:
                12px;

            padding-top:
                12px;

            border-top:
                1px solid
                rgba(255,255,255,.06);

            color:
                #5fe0ae;

            font-size:
                11px;

            font-weight:
                900;
        }


        .remaining::before {

            content:
                "مانده";
        }


        /* =========================
           FORM
        ========================= */

        .field {

            margin-bottom:
                18px;

            animation:
                fadeUp
                .55s
                ease
                both;
        }


        .field:nth-child(1) {

            animation-delay:
                .05s;
        }


        .field:nth-child(2) {

            animation-delay:
                .10s;
        }


        @keyframes fadeUp {

            from {

                opacity:
                    0;

                transform:
                    translateY(10px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }
        }


        label {

            display:
                block;

            margin-bottom:
                8px;

            color:
                #dce4ef;

            font-size:
                10.5px;

            font-weight:
                700;

            transition:
                color .25s ease;
        }


        .field:focus-within label {

            color:
                #76dfb1;
        }


        input,
        textarea {

            width:
                100%;

            min-height:
                49px;

            padding:
                12px
                14px;

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius:
                12px;

            background:
                rgba(255,255,255,.035);

            color:
                #f8fafc;

            font-family:
                inherit;

            font-size:
                12px;

            outline:
                none;

            transition:
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease,
                transform .25s ease;
        }


        input:hover,
        textarea:hover {

            border-color:
                rgba(255,255,255,.14);

            background:
                rgba(255,255,255,.045);
        }


        input:focus,
        textarea:focus {

            border-color:
                rgba(53,212,154,.40);

            background:
                rgba(53,212,154,.035);

            box-shadow:

                0 0 0 4px
                rgba(53,212,154,.065),

                0 12px 30px
                rgba(0,0,0,.12);

            transform:
                translateY(-1px);
        }


        input::placeholder,
        textarea::placeholder {

            color:
                #64748b;
        }


        textarea {

            min-height:
                112px;

            resize:
                vertical;

            line-height:
                2;
        }


        /* =========================
           NUMBER INPUT
        ========================= */

        input[type="number"] {

            direction:
                rtl;
        }


        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {

            opacity:
                .45;
        }


        /* =========================
           ERRORS
        ========================= */

        .errorlist {

            margin:
                0 0 8px;

            padding:
                0;

            list-style:
                none;

            color:
                var(--danger);

            font-size:
                10px;

            line-height:
                1.8;

            animation:
                errorShake
                .35s
                ease;
        }


        @keyframes errorShake {

            0%,
            100% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(4px);
            }

            50% {
                transform:
                    translateX(-4px);
            }

            75% {
                transform:
                    translateX(3px);
            }
        }


        /* =========================
           ACTIONS
        ========================= */

        .actions {

            display:
                grid;

            grid-template-columns:
                1.35fr
                1fr;

            gap:
                11px;

            margin-top:
                8px;

            padding-top:
                8px;
        }


        button,
        .back {

            position:
                relative;

            min-height:
                50px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                12px
                16px;

            border:
                1px solid
                transparent;

            border-radius:
                12px;

            font-family:
                inherit;

            font-size:
                10.5px;

            font-weight:
                800;

            text-align:
                center;

            text-decoration:
                none;

            cursor:
                pointer;

            overflow:
                hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease,
                border-color .25s ease;
        }


        /* =========================
           PAYMENT BUTTON
        ========================= */

        button {

            color:
                #06130e;

            background:

                linear-gradient(
                    135deg,
                    var(--green),
                    var(--green-2)
                );

            box-shadow:

                0 13px 30px
                rgba(53,212,154,.18);
        }


        button::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            right:
                -100%;

            width:
                50%;

            height:
                100%;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.25),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                right .65s ease;
        }


        button:hover::before {

            right:
                140%;
        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:

                0 18px 38px
                rgba(53,212,154,.25);
        }


        button:active {

            transform:
                translateY(1px)
                scale(.985);
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            color:
                #cbd5e1;

            background:
                rgba(255,255,255,.035);

            border-color:
                rgba(255,255,255,.075);
        }


        .back:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,.065);

            border-color:
                rgba(255,255,255,.13);

            box-shadow:
                0 12px 25px
                rgba(0,0,0,.17);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {

                padding:
                    12px;
            }


            .container {

                max-width:
                    100%;

                margin:
                    10px
                    auto;
            }


            .card {

                padding:
                    24px
                    18px;

                border-radius:
                    20px;
            }


            .header {

                gap:
                    11px;
            }


            .header-icon {

                width:
                    47px;

                height:
                    47px;

                border-radius:
                    14px;

                font-size:
                    19px;
            }


            h1 {

                font-size:
                    21px;
            }


            .student {

                font-size:
                    9.5px;
            }


            .charge-box {

                padding:
                    16px;

                border-radius:
                    14px;
            }


            .charge-title {

                font-size:
                    13px;
            }


            input,
            textarea {

                min-height:
                    50px;

                font-size:
                    12px;
            }


            textarea {

                min-height:
                    105px;
            }


            .actions {

                grid-template-columns:
                    1fr;
            }


            button,
            .back {

                width:
                    100%;

                min-height:
                    49px;
            }

        }


        @media (max-width: 420px) {

            body {

                padding:
                    7px;
            }


            .container {

                margin:
                    5px
                    auto;
            }


            .card {

                padding:
                    21px
                    14px;

                border-radius:
                    18px;
            }


            .header {

                margin-bottom:
                    20px;
            }


            .header-icon {

                width:
                    43px;

                height:
                    43px;

                border-radius:
                    12px;

                font-size:
                    17px;
            }


            h1 {

                font-size:
                    19px;
            }


            .student {

                font-size:
                    9px;
            }


            .charge-box {

                padding:
                    14px;

                margin-bottom:
                    19px;
            }


            .charge-title {

                font-size:
                    12px;
            }


            .charge-amount {

                font-size:
                    9.5px;
            }


            .remaining {

                font-size:
                    10px;

                margin-top:
                    10px;

                padding-top:
                    10px;
            }


            label {

                font-size:
                    10px;
            }


            input,
            textarea {

                padding:
                    12px;

                border-radius:
                    11px;

                font-size:
                    11px;
            }


            textarea {

                min-height:
                    100px;
            }


            button,
            .back {

                font-size:
                    10px;

                border-radius:
                    11px;
            }

        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;
            }
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">


        <div class="header">

            <div class="header-icon">
                💳
            </div>

            <div>

                <h1>
                    ثبت پرداخت
                </h1>

                <div class="student">

                    دانش‌آموز:
                    <strong>
                        {{ charge.student.first_name }}
                        {{ charge.student.last_name }}
                    </strong>

                </div>

            </div>

        </div>


        <div class="charge-box">

            <div class="charge-title">
                {{ charge.title }}
            </div>


            <div class="charge-amount">

                مبلغ کل بدهی:
                {{ charge.amount|floatformat:0 }}
                تومان

            </div>


            <div class="remaining">

                <span>
                    {{ remaining|floatformat:0 }}
                    تومان
                </span>

            </div>

        </div>


        <form method="post">

            {% csrf_token %}


            {% for field in form %}

                <div class="field">

                    {{ field.errors }}

                    <label
                        for="{{ field.id_for_label }}"
                    >
                        {{ field.label }}
                    </label>

                    {{ field }}

                </div>

            {% endfor %}


            <div class="actions">

                <button
                    type="submit"
                >
                    ثبت پرداخت
                </button>


                <a
                    href="{% url 'finance:student_finance' charge.student.id %}"
                    class="back"
                >
                    بازگشت
                </a>

            </div>

        </form>


    </div>

</div>


</body>

</html>
