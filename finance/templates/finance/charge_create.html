<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080c16"
    >

    <title>
        ثبت بدهی | کانون رویش
    </title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">


    <style>

        /* ==================================================
           ROOT / THEME
        ================================================== */

        :root {

            --bg-main: #080c16;

            --card-bg-1: #1a3055;
            --card-bg-2: #102040;
            --card-border: rgba(109, 164, 255, 0.28);
            --card-border-hover: rgba(109, 164, 255, 0.55);

            --field-bg: #050b18;
            --field-bg-hover: #08111f;
            --field-bg-focus: #020610;

            --field-border: rgba(109, 164, 255, 0.42);
            --field-border-hover: rgba(109, 164, 255, 0.7);
            --field-border-focus: #7fb4ff;

            --text-heading: #e0eaff;
            --text-label: #c8d8f5;
            --text-body: #a4b8e0;
            --text-muted: #7a8fb5;
            --text-placeholder: #4a5c7f;

            --blue: #4a7de8;
            --blue-light: #6da4ff;
            --cyan: #4cc9e8;

            --success: #4ade80;
            --success-bg: rgba(74, 222, 128, 0.12);
            --success-border: rgba(74, 222, 128, 0.35);

            --danger: #fb7185;
            --danger-bg: rgba(244, 63, 94, 0.15);
            --danger-border: rgba(244, 63, 94, 0.4);
        }


        body.light {

            --bg-main: #e8eefb;

            --card-bg-1: #c8d8f2;
            --card-bg-2: #b0c4e8;
            --card-border: rgba(58, 109, 224, 0.35);
            --card-border-hover: rgba(58, 109, 224, 0.6);

            --field-bg: #f5f8ff;
            --field-bg-hover: #ffffff;
            --field-bg-focus: #ffffff;

            --field-border: rgba(58, 109, 224, 0.35);
            --field-border-hover: rgba(58, 109, 224, 0.6);
            --field-border-focus: #2a6bff;

            --text-heading: #0a1630;
            --text-label: #1a2b52;
            --text-body: #2a4272;
            --text-muted: #4a5c80;
            --text-placeholder: #8a9abb;
        }


        /* ==================================================
           RESET
        ================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        html {
            -webkit-text-size-adjust: 100%;
        }


        body {

            margin: 0;

            min-height: 100vh;

            padding: 80px 20px 40px;

            font-family:
                'Vazirmatn',
                Tahoma,
                "Segoe UI",
                sans-serif;

            font-weight: 500;

            color: var(--text-body);

            background: var(--bg-main);

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            transition:
                background 0.5s ease,
                color 0.4s ease;
        }


        /* ==================================================
           AURORA BACKGROUND
        ================================================== */

        .bg-aurora {

            position: fixed;

            inset: 0;

            z-index: -5;

            overflow: hidden;

            pointer-events: none;
        }


        .bg-aurora__blob {

            position: absolute;

            border-radius: 50%;

            filter: blur(120px);

            opacity: 0.55;

            will-change: transform;
        }


        .bg-aurora__blob--1 {

            width: 520px;
            height: 520px;

            background:
                radial-gradient(
                    circle,
                    rgba(58, 110, 220, 0.7),
                    transparent 70%
                );

            top: -12%;
            right: -12%;

            animation: aurora1 20s ease-in-out infinite;
        }


        .bg-aurora__blob--2 {

            width: 460px;
            height: 460px;

            background:
                radial-gradient(
                    circle,
                    rgba(50, 140, 200, 0.6),
                    transparent 70%
                );

            top: 45%;
            left: -15%;

            animation: aurora2 24s ease-in-out infinite;
        }


        .bg-aurora__blob--3 {

            width: 420px;
            height: 420px;

            background:
                radial-gradient(
                    circle,
                    rgba(60, 180, 210, 0.5),
                    transparent 70%
                );

            bottom: -12%;
            right: 28%;

            animation: aurora3 26s ease-in-out infinite;
        }


        @keyframes aurora1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-130px, 90px) scale(1.2); }
        }

        @keyframes aurora2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(110px, -100px) scale(1.15); }
        }

        @keyframes aurora3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-90px, -70px) scale(1.22); }
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:

                linear-gradient(
                    rgba(109, 164, 255, 0.04) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(109, 164, 255, 0.04) 1px,
                    transparent 1px
                );

            background-size: 48px 48px;

            mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.65),
                    transparent 85%
                );

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.65),
                    transparent 85%
                );

            z-index: -3;
        }


        /* ==================================================
           TOP BAR
        ================================================== */

        .top-bar {

            position: fixed;

            top: 16px;
            left: 20px;
            right: 20px;

            z-index: 50;

            display: flex;

            align-items: center;

            justify-content: space-between;

            pointer-events: none;
        }


        .top-bar__right,
        .top-bar__left {

            display: flex;

            align-items: center;

            gap: 8px;

            pointer-events: auto;
        }


        .icon-btn {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            cursor: pointer;

            border: 1.5px solid var(--card-border);

            background: var(--card-bg-1);

            color: var(--text-heading);

            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                color 0.3s ease;
        }


        .icon-btn:hover {

            transform: translateY(-2px) scale(1.06);

            border-color: var(--blue-light);

            color: #7fb4ff;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.35),
                0 0 30px rgba(74, 125, 232, 0.35);
        }


        body.light .icon-btn:hover {
            color: #1a2b52;
        }


        .icon-btn svg {

            width: 20px;
            height: 20px;

            transition: transform 0.5s ease;
        }


        .theme-toggle:hover svg {
            transform: rotate(180deg);
        }


        .home-btn:hover svg {
            transform: translateY(-2px) scale(1.1);
        }


        .theme-toggle .icon-sun { display: none; }

        body.light .theme-toggle .icon-sun { display: block; }

        body.light .theme-toggle .icon-moon { display: none; }


        /* ==================================================
           CONTAINER
        ================================================== */

        .container {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 680px;

            margin: 0 auto;

            animation:
                pageEnter 0.75s cubic-bezier(.22, 1, .36, 1);
        }


        @keyframes pageEnter {

            from {

                opacity: 0;

                transform: translateY(28px) scale(0.985);
            }

            to {

                opacity: 1;

                transform: translateY(0) scale(1);
            }
        }


        /* ==================================================
           CARD
        ================================================== */

        .card {

            position: relative;

            padding: 36px;

            border: 1.5px solid var(--card-border);

            border-radius: 26px;

            background:
                linear-gradient(
                    155deg,
                    var(--card-bg-1) 0%,
                    var(--card-bg-2) 100%
                );

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(74, 125, 232, 0.18),
                inset 0 1px 0 rgba(180, 220, 255, 0.18),
                inset 0 -1px 0 rgba(74, 125, 232, 0.15);

            overflow: hidden;

            transition:
                transform 0.4s cubic-bezier(.22, 1, .36, 1),
                border-color 0.3s ease,
                box-shadow 0.4s ease;
        }


        body.light .card {

            box-shadow:
                0 30px 80px rgba(58, 109, 224, 0.25),
                0 0 60px rgba(58, 109, 224, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            right: 0;
            left: 0;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #6da4ff,
                    #4cc9e8,
                    #6da4ff,
                    transparent
                );

            background-size: 200% 100%;

            animation: borderShine 4s linear infinite;
        }


        @keyframes borderShine {

            to { background-position: 200% 0; }
        }


        .card::after {

            content: "";

            position: absolute;

            top: -140px;
            right: -100px;

            width: 320px;
            height: 320px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(109, 164, 255, 0.35),
                    transparent 65%
                );

            filter: blur(40px);

            pointer-events: none;
        }


        /* ==================================================
           MESSAGES
        ================================================== */

        .messages {

            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-bottom: 22px;

            animation:
                messageShow 0.5s cubic-bezier(.22, 1, .36, 1);
        }


        .message {

            padding: 14px 18px;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 700;

            line-height: 1.8;

            border: 1.5px solid;
        }


        .message--success {

            color: var(--success);

            background: var(--success-bg);

            border-color: var(--success-border);
        }


        .message--error,
        .message--danger {

            color: var(--danger);

            background: var(--danger-bg);

            border-color: var(--danger-border);
        }


        .message--warning {

            color: #fbbf24;

            background: rgba(251, 191, 36, 0.12);

            border-color: rgba(251, 191, 36, 0.35);
        }


        @keyframes messageShow {

            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* ==================================================
           HEADER
        ================================================== */

        .header {

            position: relative;

            display: flex;

            align-items: center;

            gap: 16px;

            margin-bottom: 30px;

            padding-bottom: 24px;

            border-bottom: 1px solid var(--card-border);

            animation:
                headerShow 0.6s 0.1s both
                cubic-bezier(.22, 1, .36, 1);
        }


        @keyframes headerShow {

            from {

                opacity: 0;

                transform: translateY(-10px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        .header-icon {

            position: relative;

            width: 58px;
            height: 58px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 17px;

            font-size: 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(74, 125, 232, 0.28),
                    rgba(76, 201, 232, 0.24)
                );

            border: 1.5px solid rgba(109, 164, 255, 0.35);

            box-shadow:
                inset 0 1px 0 rgba(180, 220, 255, 0.18),
                0 10px 30px rgba(0, 0, 0, 0.3);

            animation:
                iconPulse 3s ease-in-out infinite;
        }


        @keyframes iconPulse {

            0%, 100% {
                box-shadow:
                    inset 0 1px 0 rgba(180, 220, 255, 0.18),
                    0 10px 30px rgba(74, 125, 232, 0.15);
            }

            50% {
                box-shadow:
                    inset 0 1px 0 rgba(180, 220, 255, 0.25),
                    0 12px 40px rgba(76, 201, 232, 0.28);
            }
        }


        .header-text {

            min-width: 0;

            flex: 1;
        }


        h1 {

            position: relative;

            margin: 0 0 8px;

            font-size: 24px;

            line-height: 1.3;

            letter-spacing: -0.5px;

            font-weight: 800;

            color: var(--text-heading);
        }


        .description {

            margin: 0;

            color: var(--text-muted);

            font-size: 12.5px;

            font-weight: 500;

            line-height: 1.95;
        }


        /* ==================================================
           FORM
        ================================================== */

        form {

            display: flex;

            flex-direction: column;
        }


        .field {

            margin-bottom: 20px;

            animation:
                fieldEnter 0.55s both
                cubic-bezier(.22, 1, .36, 1);
        }


        .field:nth-child(1) { animation-delay: 0.06s; }
        .field:nth-child(2) { animation-delay: 0.10s; }
        .field:nth-child(3) { animation-delay: 0.14s; }
        .field:nth-child(4) { animation-delay: 0.18s; }
        .field:nth-child(5) { animation-delay: 0.22s; }


        @keyframes fieldEnter {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .field label {

            display: block;

            margin-bottom: 10px;

            color: var(--text-label);

            font-size: 12.5px;

            font-weight: 700;

            letter-spacing: -0.2px;

            transition: color 0.25s ease, transform 0.25s ease;
        }


        .field:focus-within label {

            color: var(--blue-light);

            transform: translateX(-3px);
        }


        /* ==================================================
           INPUTS
        ================================================== */

        .card .field select,
        .card .field input,
        .card .field textarea {

            display: block !important;

            width: 100% !important;

            min-height: 52px !important;

            padding: 14px 16px !important;

            margin: 0 !important;

            border: 2px solid var(--field-border) !important;

            border-radius: 12px !important;

            outline: none !important;

            background: var(--field-bg) !important;

            background-color: var(--field-bg) !important;

            background-image: none !important;

            color: var(--text-heading) !important;

            font-family: 'Vazirmatn', Tahoma, sans-serif !important;

            font-size: 14px !important;

            font-weight: 600 !important;

            direction: rtl !important;

            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.4) inset,
                0 2px 6px rgba(0, 0, 0, 0.5) inset !important;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease !important;
        }


        body.light .card .field select,
        body.light .card .field input,
        body.light .card .field textarea {

            color: #0a1630 !important;

            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.05) inset,
                0 2px 6px rgba(58, 109, 224, 0.1) inset !important;
        }


        /* حذف spinner از input number */

        .card .field input[type="number"]::-webkit-outer-spin-button,
        .card .field input[type="number"]::-webkit-inner-spin-button {

            -webkit-appearance: none !important;
            margin: 0 !important;
            display: none !important;
        }

        .card .field input[type="number"] {
            -moz-appearance: textfield !important;
            appearance: textfield !important;
        }


        /* حذف autofill آبی مرورگر */

        .card .field input:-webkit-autofill,
        .card .field input:-webkit-autofill:hover,
        .card .field input:-webkit-autofill:focus {

            -webkit-text-fill-color: var(--text-heading) !important;

            -webkit-box-shadow:
                0 0 0 1000px var(--field-bg) inset !important;
        }


        /* ==================================================
           TEXTAREA — resize دسته حذف شد
        ================================================== */

        .card .field textarea {

            min-height: 120px !important;

            padding: 14px 16px !important;

            resize: none !important;

            overflow: auto !important;

            line-height: 1.95 !important;

            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
        }


        .card .field textarea::-webkit-resizer {
            display: none !important;
            background: transparent !important;
        }


        .card .field textarea::-moz-resizer {
            display: none !important;
        }


        /* PLACEHOLDER */

        .card .field input::placeholder,
        .card .field textarea::placeholder {

            color: var(--text-placeholder) !important;

            font-weight: 500 !important;

            opacity: 1 !important;
        }


        /* HOVER */

        .card .field input:hover,
        .card .field textarea:hover,
        .card .field select:hover {

            border-color: var(--field-border-hover) !important;

            background: var(--field-bg-hover) !important;

            background-color: var(--field-bg-hover) !important;
        }


        /* FOCUS */

        .card .field input:focus,
        .card .field textarea:focus,
        .card .field select:focus {

            border-color: var(--field-border-focus) !important;

            background: var(--field-bg-focus) !important;

            background-color: var(--field-bg-focus) !important;

            transform: translateY(-1px);

            box-shadow:
                0 0 0 4px rgba(74, 125, 232, 0.28) !important,
                0 15px 35px rgba(0, 0, 0, 0.5) !important,
                0 2px 6px rgba(0, 0, 0, 0.5) inset !important;
        }


        /* ==================================================
           SELECT
        ================================================== */

        .card .field select {

            cursor: pointer;

            appearance: none !important;

            -webkit-appearance: none !important;

            -moz-appearance: none !important;

            padding-left: 44px !important;

            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236da4ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") !important;

            background-repeat: no-repeat !important;

            background-position: left 16px center !important;

            background-size: 16px !important;
        }


        body.light .card .field select {

            background-image:
                url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%232a4a8a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") !important;
        }


        .card .field select option {

            background: #050b18;

            color: #e0eaff;

            padding: 10px;
        }


        body.light .card .field select option {

            background: #f5f8ff;

            color: #0a1630;
        }


        /* ==================================================
           ERROR LIST
        ================================================== */

        .card .field .errorlist,
        .card .field ul.errorlist {

            list-style: none !important;

            margin: 0 0 10px !important;

            padding: 0 !important;

            color: var(--danger);

            font-size: 11.5px;

            font-weight: 700;

            line-height: 1.9;

            animation: errorShake 0.4s ease;
        }


        .card .field .errorlist li,
        .card .field ul.errorlist li {

            padding: 8px 12px;

            margin-bottom: 5px;

            border-radius: 8px;

            background: var(--danger-bg);

            border: 1px solid var(--danger-border);

            list-style: none;
        }


        @keyframes errorShake {

            0%, 100% { transform: translateX(0); }

            25% { transform: translateX(-4px); }

            50% { transform: translateX(4px); }

            75% { transform: translateX(-3px); }
        }


        /* ==================================================
           ACTIONS
        ================================================== */

        .actions {

            display: grid;

            grid-template-columns: 1.35fr 1fr;

            gap: 12px;

            margin-top: 26px;

            padding-top: 24px;

            border-top: 1px solid var(--card-border);
        }


        .actions button,
        .actions .back {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            min-height: 52px;

            padding: 14px 20px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-family: 'Vazirmatn', Tahoma, sans-serif;

            font-size: 13.5px;

            font-weight: 800;

            text-align: center;

            text-decoration: none;

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                filter 0.25s ease;
        }


        .actions button {

            color: #dbe6ff;

            background:
                linear-gradient(
                    135deg,
                    #3a6bc4,
                    #2e7fc4 58%,
                    #2a9ac4
                );

            box-shadow:
                0 12px 30px rgba(74, 125, 232, 0.45),
                inset 0 1px 0 rgba(180, 220, 255, 0.2);
        }


        .actions button::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 20%,
                    rgba(180, 220, 255, 0.32) 50%,
                    transparent 80%
                );

            transform: translateX(120%);

            transition: transform 0.65s ease;
        }


        .actions button:hover {

            transform: translateY(-3px);

            color: #b8d0ff;

            box-shadow:
                0 20px 45px rgba(58, 107, 196, 0.55),
                0 0 45px rgba(76, 201, 232, 0.35);

            filter: brightness(1.08);
        }


        .actions button:hover::before {
            transform: translateX(-120%);
        }


        .actions button:active {
            transform: translateY(0) scale(0.985);
        }


        .actions .back {

            color: var(--text-heading);

            background: rgba(109, 164, 255, 0.1);

            border: 1.5px solid rgba(109, 164, 255, 0.3);
        }


        .actions .back:hover {

            transform: translateY(-3px);

            background: rgba(109, 164, 255, 0.2);

            border-color: rgba(109, 164, 255, 0.6);

            box-shadow: 0 12px 28px rgba(74, 125, 232, 0.28);
        }


        /* ==================================================
           FOCUS
        ================================================== */

        .icon-btn:focus-visible,
        .actions button:focus-visible,
        .actions .back:focus-visible {

            outline: 3px solid rgba(109, 164, 255, 0.4);

            outline-offset: 3px;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 700px) {

            body {
                padding: 76px 14px 32px;
            }


            .top-bar {

                top: 12px;
                left: 14px;
                right: 14px;
            }


            .icon-btn {

                width: 42px;
                height: 42px;

                border-radius: 11px;
            }


            .icon-btn svg {

                width: 19px;
                height: 19px;
            }


            .container {
                max-width: 100%;
            }


            .card {

                padding: 26px 20px;

                border-radius: 20px;
            }


            .header {

                gap: 14px;

                margin-bottom: 24px;

                padding-bottom: 20px;
            }


            .header-icon {

                width: 52px;
                height: 52px;

                border-radius: 15px;

                font-size: 24px;
            }


            h1 {
                font-size: 20px;
            }


            .description {
                font-size: 12px;
            }


            .field {
                margin-bottom: 18px;
            }


            .field label {

                font-size: 12px;

                margin-bottom: 9px;
            }


            .card .field select,
            .card .field input,
            .card .field textarea {

                min-height: 52px !important;

                padding: 14px 15px !important;

                border-radius: 11px !important;

                font-size: 14px !important;
            }


            .card .field textarea {
                min-height: 110px !important;
            }


            .actions {

                grid-template-columns: 1fr;

                gap: 10px;

                margin-top: 22px;

                padding-top: 20px;
            }


            .actions button,
            .actions .back {

                width: 100%;

                min-height: 52px;

                font-size: 13.5px;
            }
        }


        /* ==================================================
           TINY PHONES
        ================================================== */

        @media (max-width: 400px) {

            body {
                padding: 72px 11px 28px;
            }


            .top-bar {

                top: 10px;
                left: 10px;
                right: 10px;
            }


            .icon-btn {

                width: 40px;
                height: 40px;

                border-radius: 10px;
            }


            .icon-btn svg {

                width: 18px;
                height: 18px;
            }


            .card {

                padding: 22px 16px;

                border-radius: 18px;
            }


            .header {

                gap: 12px;

                margin-bottom: 22px;
            }


            .header-icon {

                width: 46px;
                height: 46px;

                border-radius: 13px;

                font-size: 21px;
            }


            h1 {
                font-size: 18px;
            }


            .description {
                font-size: 11.5px;
            }


            .card .field select,
            .card .field input,
            .card .field textarea {

                font-size: 13px !important;
            }
        }


        /* ==================================================
           REDUCED MOTION
        ================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- AURORA -->

    <div class="bg-aurora" aria-hidden="true">

        <div class="bg-aurora__blob bg-aurora__blob--1"></div>
        <div class="bg-aurora__blob bg-aurora__blob--2"></div>
        <div class="bg-aurora__blob bg-aurora__blob--3"></div>

    </div>


    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="top-bar__right">

            <button
                type="button"
                class="icon-btn theme-toggle"
                id="themeToggle"
                aria-label="تغییر تم"
                title="تغییر تم روشن/تاریک"
            >

                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>

                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>

            </button>


            <a
                href="{% url 'coaches:dashboard' %}"
                class="icon-btn home-btn"
                title="بازگشت به داشبورد"
                aria-label="بازگشت به داشبورد"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M3 12l9-9 9 9"/>
                    <path d="M5 10v10h14V10"/>

                </svg>

            </a>

        </div>

    </div>


    <!-- CONTAINER -->

    <div class="container">

        <div class="card">


            <!-- MESSAGES -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message message--{{ message.tags|default:'info' }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}



            <!-- HEADER -->

            <div class="header">

                <div class="header-icon">
                    💳
                </div>

                <div class="header-text">

                    <h1>
                        ثبت بدهی
                    </h1>

                    <p class="description">
                        از این بخش می‌توانید یک هزینه یا بدهی را برای دانش‌آموز ثبت کنید.
                    </p>

                </div>

            </div>



            <!-- FORM -->

            <form method="post">

                {% csrf_token %}


                {% for field in form %}

                    <div class="field">

                        {{ field.errors }}

                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>

                        {{ field }}

                    </div>

                {% endfor %}


                <div class="actions">

                    <button type="submit">
                        ثبت بدهی
                    </button>

                    <a
                        href="{% url 'coaches:dashboard' %}"
                        class="back"
                    >
                        بازگشت به داشبورد
                    </a>

                </div>

            </form>

        </div>

    </div>



    <!-- SCRIPT -->

    <script>

    (function () {
        "use strict";

        const themeToggle = document.getElementById("themeToggle");
        const STORAGE_KEY = "rooyesh-theme";

        function applyTheme(theme) {

            if (theme === "light") {
                document.body.classList.add("light");
            } else {
                document.body.classList.remove("light");
            }
        }


        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            applyTheme(saved);
        } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
        ) {
            applyTheme("light");
        }


        if (themeToggle) {

            themeToggle.addEventListener("click", () => {

                const isLight =
                    document.body.classList.toggle("light");

                localStorage.setItem(
                    STORAGE_KEY,
                    isLight ? "light" : "dark"
                );
            });
        }

    })();

    </script>


</body>

</html>
