
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ثبت بدهی | کانون رویش
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg-main: #060914;
            --bg-card: rgba(14, 20, 34, .78);

            --border: rgba(255, 255, 255, .09);
            --border-hover: rgba(95, 155, 255, .35);

            --text-main: #f8fafc;
            --text-soft: #94a3b8;

            --blue: #4f8cff;
            --purple: #7c5cff;
            --pink: #b15cff;

            --danger: #fb7185;

            --radius-lg: 24px;
            --radius-md: 13px;
        }


        /* =========================
           BODY
        ========================= */

        body {

            margin: 0;

            min-height: 100vh;

            padding:
                24px
                16px;

            font-family:
                Tahoma,
                "Segoe UI",
                sans-serif;

            color: var(--text-main);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(79, 140, 255, .11),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 90% 20%,
                    rgba(124, 92, 255, .11),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(177, 92, 255, .08),
                    transparent 35%
                ),

                linear-gradient(
                    145deg,
                    #050711,
                    #0a1020 45%,
                    #080c18
                );

            overflow-x: hidden;
        }


        /* =========================
           MOVING BACKGROUND
        ========================= */

        body::before,
        body::after {

            content: "";

            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(80px);

            pointer-events: none;

            z-index: 0;

            animation:
                floatGlow
                10s
                ease-in-out
                infinite
                alternate;
        }

        body::before {

            top: -100px;
            right: -90px;

            background:
                rgba(79, 140, 255, .11);
        }

        body::after {

            bottom: -120px;
            left: -100px;

            background:
                rgba(124, 92, 255, .10);

            animation-delay: -4s;
        }


        @keyframes floatGlow {

            from {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate3d(25px, 20px, 0)
                    scale(1.12);
            }
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            position: relative;

            z-index: 1;

            width: 100%;

            max-width: 650px;

            margin:
                40px
                auto;

            animation:
                pageEnter
                .7s
                cubic-bezier(.2,.8,.2,1);
        }


        @keyframes pageEnter {

            from {

                opacity: 0;

                transform:
                    translateY(28px)
                    scale(.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================
           CARD
        ========================= */

        .card {

            position: relative;

            padding: 34px;

            border:
                1px solid
                var(--border);

            border-radius:
                var(--radius-lg);

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 28, 48, .88),
                    rgba(10, 15, 28, .82)
                );

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.45),

                inset 0 1px 0
                rgba(255,255,255,.04);

            overflow: hidden;

            transition:
                transform .35s ease,
                border-color .35s ease,
                box-shadow .35s ease;
        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            right: 0;
            left: 0;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(92, 146, 255, .65),
                    rgba(165, 103, 255, .65),
                    transparent
                );

            opacity: .8;
        }


        .card:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(255,255,255,.12);

            box-shadow:
                0 35px 100px
                rgba(0,0,0,.52),

                inset 0 1px 0
                rgba(255,255,255,.05);
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 28px;
        }


        .header-icon {

            position: relative;

            width: 52px;
            height: 52px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(79,140,255,.18),
                    rgba(124,92,255,.18)
                );

            border:
                1px solid
                rgba(112, 145, 255, .20);

            box-shadow:
                0 10px 30px
                rgba(79,140,255,.12);

            font-size: 22px;

            animation:
                iconPulse
                3s
                ease-in-out
                infinite;
        }


        @keyframes iconPulse {

            0%,
            100% {
                box-shadow:
                    0 10px 30px
                    rgba(79,140,255,.10);
            }

            50% {
                box-shadow:
                    0 10px 38px
                    rgba(124,92,255,.18);
            }
        }


        h1 {

            margin: 0 0 7px;

            font-size: 25px;

            line-height: 1.3;

            letter-spacing: -.4px;
        }


        .description {

            margin: 0;

            color: var(--text-soft);

            font-size: 11px;

            line-height: 2;

            max-width: 500px;
        }


        /* =========================
           FORM
        ========================= */

        form {

            display: flex;

            flex-direction: column;

            gap: 3px;
        }


        .field {

            margin-bottom: 18px;

            animation:
                fieldEnter
                .55s
                ease both;
        }


        .field:nth-child(1) {
            animation-delay: .05s;
        }

        .field:nth-child(2) {
            animation-delay: .10s;
        }

        .field:nth-child(3) {
            animation-delay: .15s;
        }

        .field:nth-child(4) {
            animation-delay: .20s;
        }

        .field:nth-child(5) {
            animation-delay: .25s;
        }


        @keyframes fieldEnter {

            from {

                opacity: 0;

                transform:
                    translateY(10px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #dce4ef;

            font-size: 11px;

            font-weight: 700;

            transition:
                color .25s ease;
        }


        .field:focus-within label {

            color:
                #82adff;
        }


        select,
        input,
        textarea {

            width: 100%;

            min-height: 47px;

            padding:
                12px
                14px;

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius:
                var(--radius-md);

            background:
                rgba(255,255,255,.035);

            color: #f8fafc;

            font-family: inherit;

            font-size: 12px;

            outline: none;

            transition:
                border-color .25s ease,
                background .25s ease,
                box-shadow .25s ease,
                transform .25s ease;
        }


        select:hover,
        input:hover,
        textarea:hover {

            background:
                rgba(255,255,255,.05);

            border-color:
                rgba(255,255,255,.15);
        }


        select:focus,
        input:focus,
        textarea:focus {

            background:
                rgba(79,140,255,.045);

            border-color:
                var(--border-hover);

            box-shadow:
                0 0 0 4px
                rgba(79,140,255,.08),

                0 10px 30px
                rgba(0,0,0,.12);

            transform:
                translateY(-1px);
        }


        input::placeholder,
        textarea::placeholder {

            color:
                #64748b;
        }


        textarea {

            min-height: 115px;

            resize:
                vertical;

            line-height: 2;
        }


        /* =========================
           SELECT
        ========================= */

        select {

            cursor: pointer;

            appearance: none;

            -webkit-appearance: none;

            padding-left: 42px;

            background-image:
                linear-gradient(
                    45deg,
                    transparent 50%,
                    #8da5d7 50%
                ),
                linear-gradient(
                    135deg,
                    #8da5d7 50%,
                    transparent 50%
                );

            background-position:
                calc(100% - 20px) 21px,
                calc(100% - 14px) 21px;

            background-size:
                6px 6px,
                6px 6px;

            background-repeat:
                no-repeat;
        }


        select option {

            background:
                #101827;

            color:
                #f8fafc;
        }


        /* =========================
           ERRORS
        ========================= */

        .errorlist {

            margin:
                0 0 8px;

            padding: 0;

            list-style: none;

            color:
                var(--danger);

            font-size: 10px;

            line-height: 1.8;

            animation:
                errorShake
                .35s
                ease;
        }


        @keyframes errorShake {

            0%,
            100% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(4px);
            }

            50% {
                transform:
                    translateX(-4px);
            }

            75% {
                transform:
                    translateX(3px);
            }
        }


        /* =========================
           ACTIONS
        ========================= */

        .actions {

            display: grid;

            grid-template-columns:
                1.35fr
                1fr;

            gap: 12px;

            margin-top: 8px;

            padding-top: 8px;
        }


        button,
        .back {

            position: relative;

            min-height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                12px
                16px;

            border:
                1px solid transparent;

            border-radius:
                12px;

            font-family: inherit;

            font-size: 11px;

            font-weight: 700;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }


        button {

            color:
                #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #4f8cff,
                    #695cff 55%,
                    #815cff
                );

            box-shadow:
                0 12px 30px
                rgba(79,140,255,.20);
        }


        button::before {

            content: "";

            position: absolute;

            top: 0;
            right: -100%;

            width: 55%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.18),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                right .65s ease;
        }


        button:hover::before {

            right: 140%;
        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 16px 35px
                rgba(79,140,255,.28);
        }


        button:active {

            transform:
                translateY(1px)
                scale(.985);

            box-shadow:
                0 7px 18px
                rgba(79,140,255,.18);
        }


        .back {

            color:
                #cbd5e1;

            background:
                rgba(255,255,255,.04);

            border-color:
                rgba(255,255,255,.08);
        }


        .back:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,.07);

            border-color:
                rgba(255,255,255,.13);

            box-shadow:
                0 12px 25px
                rgba(0,0,0,.18);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            body {
                padding:
                    14px;
            }

            .container {

                max-width: 100%;

                margin:
                    15px
                    auto;
            }

            .card {

                padding:
                    24px
                    19px;

                border-radius:
                    20px;
            }

            h1 {

                font-size: 21px;
            }

            .description {

                font-size: 10px;
            }

            .header-icon {

                width: 48px;
                height: 48px;

                border-radius:
                    14px;

                font-size: 20px;
            }

            select,
            input,
            textarea {

                min-height: 49px;

                padding:
                    13px
                    12px;

                font-size: 12px;
            }

            textarea {

                min-height:
                    110px;
            }

            .actions {

                grid-template-columns:
                    1fr;
            }

            button,
            .back {

                width: 100%;

                min-height:
                    49px;
            }
        }


        @media (max-width: 420px) {

            body {

                padding:
                    9px;
            }

            .container {

                margin:
                    7px
                    auto;
            }

            .card {

                padding:
                    21px
                    15px;

                border-radius:
                    18px;
            }

            .header {

                gap: 11px;

                margin-bottom:
                    23px;
            }

            .header-icon {

                width: 43px;
                height: 43px;

                border-radius:
                    12px;

                font-size:
                    18px;
            }

            h1 {

                font-size:
                    19px;
            }

            .description {

                font-size:
                    9.5px;

                line-height:
                    1.9;
            }

            label {

                font-size:
                    10px;
            }

            .field {

                margin-bottom:
                    15px;
            }

            select,
            input,
            textarea {

                min-height:
                    48px;

                border-radius:
                    11px;

                font-size:
                    11px;
            }

            textarea {

                min-height:
                    100px;
            }

            button,
            .back {

                font-size:
                    10px;

                border-radius:
                    11px;
            }
        }


        /* =========================
           REDUCED MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <div class="header-icon">
                    💳
                </div>

                <div>

                    <h1>
                        ثبت بدهی
                    </h1>

                    <div class="description">
                        از این بخش می‌توانید یک هزینه یا بدهی را برای
                        دانش‌آموز ثبت کنید.
                    </div>

                </div>

            </div>


            <form method="post">

                {% csrf_token %}


                {% for field in form %}

                    <div class="field">

                        {{ field.errors }}

                        <label
                            for="{{ field.id_for_label }}"
                        >
                            {{ field.label }}
                        </label>

                        {{ field }}

                    </div>

                {% endfor %}


                <div class="actions">

                    <button
                        type="submit"
                    >
                        ثبت بدهی
                    </button>

                    <a
                        href="{% url 'coaches:dashboard' %}"
                        class="back"
                    >
                        بازگشت به داشبورد
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
