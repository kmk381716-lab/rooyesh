<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080c16"
    >

    <title>
        ورود مربیان | کانون رویش
    </title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">


    <style>

        /* ==================================================
           ROOT / THEME — کنتراست بالا
        ================================================== */

        :root {

            --bg: #080c16;

            --card: rgba(18, 28, 50, 0.9);
            --card-border: rgba(109, 164, 255, 0.16);

            /* متن‌ها با کنتراست خوب */
            --text-heading: #b8d0ff;      /* تیتر - آبی روشن، واضح */
            --text-label: #a4b8e0;         /* لیبل - آبی ملایم */
            --text-body: #8fa6c9;          /* متن عادی */
            --text-muted: #6d80a5;         /* متن کم‌رنگ */
            --text-placeholder: #4a5c7f;   /* پلیس‌هولدر */

            --input-bg: rgba(10, 16, 32, 0.75);
            --input-border: rgba(109, 164, 255, 0.2);

            --blue: #4a7de8;
            --blue-light: #6da4ff;
            --cyan: #4cc9e8;

            --danger: #fb7185;
            --danger-bg: rgba(244, 63, 94, 0.12);
            --danger-border: rgba(244, 63, 94, 0.28);

            --shadow-card: 0 30px 90px rgba(0, 0, 0, 0.5);
            --shadow-button: 0 12px 30px rgba(74, 125, 232, 0.32);
        }


        body.light {

            --bg: #e8eefb;

            --card: rgba(214, 226, 248, 0.92);
            --card-border: rgba(58, 109, 224, 0.22);

            /* در حالت روشن هم کنتراست بالا */
            --text-heading: #1a2b52;
            --text-label: #2a4272;
            --text-body: #42527a;
            --text-muted: #5a6d8e;
            --text-placeholder: #7a8aab;

            --input-bg: rgba(200, 216, 244, 0.7);
            --input-border: rgba(58, 109, 224, 0.24);

            --shadow-card: 0 30px 90px rgba(58, 109, 224, 0.18);
            --shadow-button: 0 12px 30px rgba(58, 109, 224, 0.28);
        }


        /* ==================================================
           RESET
        ================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 80px 20px 25px;

            font-family:
                'Vazirmatn',
                Tahoma,
                "Segoe UI",
                sans-serif;

            font-weight: 500;

            color: var(--text-body);

            background: var(--bg);

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

            transition:
                background 0.5s ease,
                color 0.4s ease;
        }


        /* ==================================================
           AURORA
        ================================================== */

        .bg-aurora {

            position: fixed;

            inset: 0;

            z-index: -5;

            overflow: hidden;

            pointer-events: none;
        }


        .bg-aurora__blob {

            position: absolute;

            border-radius: 50%;

            filter: blur(120px);

            opacity: 0.55;

            will-change: transform;
        }


        .bg-aurora__blob--1 {

            width: 520px;
            height: 520px;

            background:
                radial-gradient(
                    circle,
                    rgba(58, 110, 220, 0.7),
                    transparent 70%
                );

            top: -12%;
            right: -12%;

            animation: aurora1 20s ease-in-out infinite;
        }


        .bg-aurora__blob--2 {

            width: 460px;
            height: 460px;

            background:
                radial-gradient(
                    circle,
                    rgba(50, 140, 200, 0.6),
                    transparent 70%
                );

            top: 45%;
            left: -15%;

            animation: aurora2 24s ease-in-out infinite;
        }


        .bg-aurora__blob--3 {

            width: 420px;
            height: 420px;

            background:
                radial-gradient(
                    circle,
                    rgba(60, 180, 210, 0.5),
                    transparent 70%
                );

            bottom: -12%;
            right: 28%;

            animation: aurora3 26s ease-in-out infinite;
        }


        @keyframes aurora1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-130px, 90px) scale(1.2); }
        }

        @keyframes aurora2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(110px, -100px) scale(1.15); }
        }

        @keyframes aurora3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-90px, -70px) scale(1.22); }
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:

                linear-gradient(
                    rgba(109, 164, 255, 0.04) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(109, 164, 255, 0.04) 1px,
                    transparent 1px
                );

            background-size: 48px 48px;

            mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.65),
                    transparent 85%
                );

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.65),
                    transparent 85%
                );

            z-index: -3;
        }


        /* ==================================================
           TOP BAR — دکمه‌های تم و خانه
        ================================================== */

        .top-bar {

            position: fixed;

            top: 16px;
            left: 20px;
            right: 20px;

            z-index: 50;

            display: flex;

            align-items: center;

            justify-content: space-between;

            pointer-events: none;
        }


        .top-bar__right,
        .top-bar__left {

            display: flex;

            align-items: center;

            gap: 8px;

            pointer-events: auto;
        }


        .icon-btn {

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            cursor: pointer;

            border: 1px solid var(--card-border);

            background: var(--card);

            color: var(--text-heading);

            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);

            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                color 0.3s ease;
        }


        .icon-btn:hover {

            transform: translateY(-2px) scale(1.06);

            background: var(--card);

            border-color: var(--blue-light);

            color: #7fb4ff;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(74, 125, 232, 0.3);
        }


        body.light .icon-btn {

            box-shadow: 0 8px 22px rgba(58, 109, 224, 0.15);
        }


        body.light .icon-btn:hover {

            color: #1a2b52;

            box-shadow:
                0 12px 30px rgba(58, 109, 224, 0.25),
                0 0 30px rgba(58, 109, 224, 0.15);
        }


        .icon-btn svg {

            width: 20px;
            height: 20px;

            transition: transform 0.5s ease;
        }


        .theme-toggle:hover svg {
            transform: rotate(180deg);
        }


        .home-btn:hover svg {
            transform: translateY(-2px) scale(1.1);
        }


        .theme-toggle .icon-sun { display: none; }

        body.light .theme-toggle .icon-sun { display: block; }

        body.light .theme-toggle .icon-moon { display: none; }


        /* ==================================================
           LOGIN BOX
        ================================================== */

        .login-box {

            position: relative;

            width: 100%;

            max-width: 440px;

            padding: 36px;

            border-radius: 26px;

            background: var(--card);

            border: 1px solid var(--card-border);

            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);

            box-shadow: var(--shadow-card);

            overflow: hidden;

            animation:
                loginShow 0.8s cubic-bezier(.22, 1, .36, 1);

            transition:
                background 0.4s ease,
                border-color 0.4s ease;
        }


        .login-box::before {

            content: "";

            position: absolute;

            top: -130px;
            right: -110px;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(74, 125, 232, 0.2),
                    transparent 70%
                );

            pointer-events: none;
        }


        .login-box::after {

            content: "";

            position: absolute;

            top: 0;
            right: 0;
            left: 0;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(109, 164, 255, 0.8),
                    rgba(76, 201, 232, 0.7),
                    transparent
                );

            opacity: 0.9;
        }


        /* ==================================================
           TITLE / LOGO
        ================================================== */

        .title {

            text-align: center;

            margin-bottom: 30px;

            animation:
                titleShow 0.65s 0.08s both
                cubic-bezier(.22, 1, .36, 1);
        }


        .logo {

            position: relative;

            width: 68px;
            height: 68px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    rgba(74, 125, 232, 0.22),
                    rgba(76, 201, 232, 0.2)
                );

            border: 1px solid rgba(109, 164, 255, 0.26);

            color: #7fb4ff;

            box-shadow:
                inset 0 0 25px rgba(74, 125, 232, 0.1),
                0 12px 30px rgba(0, 0, 0, 0.3);

            animation:
                logoPulse 3s ease-in-out infinite;
        }


        .logo svg {

            width: 32px;
            height: 32px;
        }


        .title h1 {

            margin-bottom: 9px;

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -0.5px;

            background: linear-gradient(120deg, #7fb4ff, #5ec0e8);

            background-size: 200% 200%;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: gradientText 6s ease infinite;
        }


        body.light .title h1 {
            background: linear-gradient(120deg, #2a4a8a, #2e7bc4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }


        .title p {

            color: var(--text-muted);

            font-size: 12px;

            font-weight: 500;

            line-height: 1.8;
        }


        /* ==================================================
           ERROR
        ================================================== */

        .error {

            position: relative;

            padding: 13px 15px;

            margin-bottom: 22px;

            border-radius: 12px;

            color: var(--danger);

            background: var(--danger-bg);

            border: 1px solid var(--danger-border);

            font-size: 12px;

            font-weight: 600;

            line-height: 1.9;

            animation:
                errorShow 0.4s cubic-bezier(.22, 1, .36, 1);
        }


        /* ==================================================
           FORM GROUP
        ================================================== */

        .form-group {

            margin-bottom: 20px;

            animation:
                fieldShow 0.55s both
                cubic-bezier(.22, 1, .36, 1);
        }


        .form-group:nth-of-type(1) { animation-delay: 0.12s; }
        .form-group:nth-of-type(2) { animation-delay: 0.18s; }


        .form-group label {

            display: block;

            margin-bottom: 9px;

            color: var(--text-label);

            font-size: 12.5px;

            font-weight: 700;

            transition:
                color 0.25s ease,
                transform 0.25s ease;
        }


        .form-group:focus-within label {

            color: var(--text-heading);

            transform: translateX(-3px);
        }


        /* ==================================================
           INPUT
        ================================================== */

        .form-group input {

            width: 100%;

            min-height: 52px;

            padding: 14px 16px;

            border-radius: 12px;

            border: 1px solid var(--input-border);

            outline: none;

            background: var(--input-bg);

            color: var(--text-heading);

            font-family: 'Vazirmatn', Tahoma, sans-serif;

            font-size: 13.5px;

            font-weight: 600;

            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease,
                transform 0.25s ease;
        }


        body.light .form-group input {

            color: #1a2b52;

            box-shadow: inset 0 1px 2px rgba(58, 109, 224, 0.08);
        }


        .form-group input::placeholder {

            color: var(--text-placeholder);

            font-weight: 500;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }


        .form-group input:hover {

            border-color: rgba(109, 164, 255, 0.4);

            background: rgba(10, 16, 32, 0.9);
        }


        body.light .form-group input:hover {

            background: rgba(200, 216, 244, 0.9);
        }


        .form-group input:focus {

            border-color: rgba(109, 164, 255, 0.8);

            background: rgba(7, 13, 25, 0.98);

            transform: translateY(-1px);

            box-shadow:
                0 0 0 4px rgba(74, 125, 232, 0.14),
                0 12px 28px rgba(0, 0, 0, 0.3);
        }


        body.light .form-group input:focus {

            background: rgba(200, 216, 244, 0.98);

            box-shadow:
                0 0 0 4px rgba(58, 109, 224, 0.16),
                0 12px 28px rgba(58, 109, 224, 0.12);
        }


        .form-group input:focus::placeholder {

            opacity: 0.35;

            transform: translateX(-3px);
        }


        /* ==================================================
           SUBMIT BUTTON
        ================================================== */

        .submit-btn {

            position: relative;

            width: 100%;

            min-height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            color: #cfe0ff;

            font-family: 'Vazirmatn', Tahoma, sans-serif;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: -0.2px;

            background:
                linear-gradient(
                    135deg,
                    #3a6bc4,
                    #2e7fc4 58%,
                    #2a9ac4
                );

            box-shadow: var(--shadow-button);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease,
                color 0.25s ease;
        }


        .submit-btn::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    110deg,
                    transparent 20%,
                    rgba(180, 220, 255, 0.28) 50%,
                    transparent 80%
                );

            transform: translateX(120%);

            transition: transform 0.65s ease;
        }


        .submit-btn::after {

            content: "←";

            position: absolute;

            left: 20px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            font-weight: 700;

            opacity: 0.8;

            transition: transform 0.25s ease;
        }


        .submit-btn:hover {

            transform: translateY(-3px);

            color: #b8d0ff;

            box-shadow:
                0 18px 40px rgba(58, 107, 196, 0.5),
                0 0 40px rgba(76, 201, 232, 0.28);

            filter: brightness(1.08);
        }


        .submit-btn:hover::before {
            transform: translateX(-120%);
        }


        .submit-btn:hover::after {
            transform: translate(-4px, -50%);
        }


        .submit-btn:active {
            transform: translateY(0) scale(.985);
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .login-footer {

            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid var(--card-border);

            text-align: center;

            color: var(--text-muted);

            font-size: 10.5px;

            font-weight: 500;

            line-height: 1.9;
        }


        /* ==================================================
           FOCUS
        ================================================== */

        input:focus-visible,
        button:focus-visible,
        .icon-btn:focus-visible {

            outline: 3px solid rgba(109, 164, 255, 0.28);

            outline-offset: 3px;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 500px) {

            body {

                padding: 76px 14px 24px;
            }


            .top-bar {

                top: 12px;
                left: 14px;
                right: 14px;
            }


            .icon-btn {

                width: 42px;
                height: 42px;

                border-radius: 11px;
            }


            .icon-btn svg {

                width: 19px;
                height: 19px;
            }


            .login-box {

                max-width: 100%;

                padding: 26px 20px;

                border-radius: 20px;
            }


            .title {

                margin-bottom: 24px;
            }


            .logo {

                width: 60px;
                height: 60px;

                margin-bottom: 15px;

                border-radius: 16px;
            }


            .logo svg {

                width: 28px;
                height: 28px;
            }


            .title h1 {
                font-size: 21px;
            }


            .title p {
                font-size: 11px;
            }


            .error {

                padding: 11px 13px;

                font-size: 11.5px;
            }


            .form-group {
                margin-bottom: 18px;
            }


            .form-group label {

                font-size: 12px;

                margin-bottom: 8px;
            }


            .form-group input {

                min-height: 50px;

                padding: 13px 15px;

                font-size: 13px;
            }


            .submit-btn {

                min-height: 50px;

                font-size: 12.5px;
            }


            .submit-btn::after {

                left: 16px;

                font-size: 17px;
            }


            .login-footer {

                margin-top: 20px;

                padding-top: 16px;

                font-size: 10px;
            }
        }


        /* ==================================================
           TINY PHONES
        ================================================== */

        @media (max-width: 370px) {

            body {
                padding: 72px 10px 20px;
            }


            .top-bar {
                left: 10px;
                right: 10px;
            }


            .icon-btn {

                width: 38px;
                height: 38px;

                border-radius: 10px;
            }


            .icon-btn svg {

                width: 17px;
                height: 17px;
            }


            .login-box {

                padding: 22px 16px;

                border-radius: 18px;
            }


            .logo {

                width: 54px;
                height: 54px;
            }


            .logo svg {

                width: 25px;
                height: 25px;
            }


            .title h1 {
                font-size: 19px;
            }


            .title p {
                font-size: 10px;
            }
        }


        /* ==================================================
           REDUCED MOTION
        ================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }


        /* ==================================================
           ANIMATIONS
        ================================================== */

        @keyframes gradientText {

            0%, 100% { background-position: 0% 50%; }

            50% { background-position: 100% 50%; }
        }


        @keyframes loginShow {

            from {
                opacity: 0;
                transform: translateY(25px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        @keyframes titleShow {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes fieldShow {

            from {
                opacity: 0;
                transform: translateY(9px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes errorShow {

            from {
                opacity: 0;
                transform: translateY(-7px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        @keyframes logoPulse {

            0%, 100% {
                box-shadow:
                    inset 0 0 25px rgba(74, 125, 232, 0.1),
                    0 12px 30px rgba(0, 0, 0, 0.3);
            }

            50% {
                box-shadow:
                    inset 0 0 30px rgba(76, 201, 232, 0.2),
                    0 14px 35px rgba(74, 125, 232, 0.2);
            }
        }

    </style>

</head>


<body>


    <!-- AURORA -->

    <div class="bg-aurora" aria-hidden="true">

        <div class="bg-aurora__blob bg-aurora__blob--1"></div>
        <div class="bg-aurora__blob bg-aurora__blob--2"></div>
        <div class="bg-aurora__blob bg-aurora__blob--3"></div>

    </div>


    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="top-bar__right">

            <!-- دکمه تم -->

            <button
                type="button"
                class="icon-btn theme-toggle"
                id="themeToggle"
                aria-label="تغییر تم"
                title="تغییر تم روشن/تاریک"
            >

                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>

                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>

            </button>


            <!-- دکمه خانه -->

            <a
                href="{% url 'home' %}"
                class="icon-btn home-btn"
                title="صفحه خانه"
                aria-label="بازگشت به صفحه خانه"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M3 12l9-9 9 9"/>
                    <path d="M5 10v10h14V10"/>

                </svg>

            </a>

        </div>

    </div>


    <!-- LOGIN BOX -->

    <main class="login-box">


        <!-- Title -->

        <div class="title">


            <div class="logo">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>

                    <circle cx="12" cy="7" r="4"/>

                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>

                </svg>

            </div>


            <h1>
                پنل مربیان
            </h1>


            <p>
                کانون فرهنگی تربیتی رویش
            </p>

        </div>



        <!-- Error -->

        {% if error %}

            <div class="error">

                {{ error }}

            </div>

        {% endif %}



        <!-- Form -->

        <form method="post">

            {% csrf_token %}


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    نام کاربری
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="نام کاربری خود را وارد کنید"
                    autocomplete="username"
                    required
                >

            </div>



            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="رمز عبور خود را وارد کنید"
                    autocomplete="current-password"
                    required
                >

            </div>



            <!-- Submit -->

            <button
                type="submit"
                class="submit-btn"
            >
                ورود به پنل
            </button>


        </form>



        <!-- Footer -->

        <div class="login-footer">

            کانون فرهنگی تربیتی رویش
            <br>
            پنل اختصاصی مربیان

        </div>


    </main>



    <!-- SCRIPT -->

    <script>

    (function () {
        "use strict";

        const themeToggle = document.getElementById("themeToggle");
        const STORAGE_KEY = "rooyesh-theme";

        function applyTheme(theme) {

            if (theme === "light") {
                document.body.classList.add("light");
            } else {
                document.body.classList.remove("light");
            }
        }


        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
            applyTheme(saved);
        } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
        ) {
            applyTheme("light");
        }


        if (themeToggle) {

            themeToggle.addEventListener("click", () => {

                const isLight =
                    document.body.classList.toggle("light");

                localStorage.setItem(
                    STORAGE_KEY,
                    isLight ? "light" : "dark"
                );
            });
        }

    })();

    </script>


</body>

</html>
