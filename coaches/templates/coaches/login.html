<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود مربیان | کانون رویش</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Tahoma, sans-serif;

            background: #f3f4f6;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .title p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-family: inherit;
            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #222;
        }

        .error {
            background: #ffe9e9;
            color: #b42318;

            padding: 10px 12px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 13px;
        }

        button {
            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 13px;

            background: #111;
            color: white;

            font-family: inherit;
            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #222;
        }

    </style>
</head>

<body>

    <div class="login-box">

        <div class="title">

            <h1>پنل مربیان</h1>

            <p>
                کانون فرهنگی تربیتی رویش
            </p>

        </div>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    نام کاربری
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="نام کاربری خود را وارد کنید"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="رمز عبور خود را وارد کنید"
                    required
                >

            </div>

            <button type="submit">
                ورود به پنل
            </button>

        </form>

    </div>

</body>

</html>
